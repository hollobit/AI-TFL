a referencia normativa (ts5723_ref)."}, "consider": {"ko": "TS 5723 특성 목록은 비망라(non-exhaustive)이므로 시장·규제가 요구하는 특성은 확장 추가하되 확장분은 'ext' 참조로 구분 표기한다. 표준 개정(생성형 AI 반영 개정안 등) 시 특성·정의를 주기적으로 재대조하는 유지 절차가 필요하다. 견고성↔복원력↔신뢰성처럼 상관·중복되는 특성은 정의와 평가방법으로 경계를 명확히 해 이중 계상을 피한다. 특성 수(29)가 많아 인지부하가 생기므로 라벨 표시에서는 프로파일·must-know로 압축하고, 카탈로그에서만 전체를 노출한다.", "en": "The TS 5723 list is non-exhaustive, so market/regulation-driven characteristics are added but marked with an 'ext' reference. A maintenance procedure must periodically re-check characteristics and definitions against standard revisions (e.g., generative-AI amendments). Correlated characteristics (robustness↔resilience↔reliability) are delimited by definition and evaluation method to avoid double counting. With 29 characteristics, cognitive load is real — the label view compresses via profiles and must-know, exposing the full set only in the catalog.", "zh": "TS 5723 清单为非穷尽，市场·监管所需特性可扩展但以「ext」参照区分标注。须运营维护流程，随标准修订(如生成式 AI 修正案)定期重新对照特性与定义。鲁棒性↔韧性↔可靠性等相关·重叠特性以定义与评估方法界定边界，避免重复计算。特性多达 29 项会产生认知负荷——标签展示经配置与 must-know 压缩，仅在目录中展示全集。", "de": "Die Liste in TS 5723 ist nicht abschließend; daher werden markt- bzw. regulierungsbedingte Merkmale ergänzt, jedoch mit einem „ext“-Verweis gekennzeichnet. Ein Pflegeverfahren muss Merkmale und Definitionen regelmäßig gegen Normrevisionen (z. B. Änderungen zu generativer KI) prüfen. Korrelierte Merkmale (Robustheit↔Resilienz↔Zuverlässigkeit) werden durch Definition und Bewertungsverfahren abgegrenzt, um Doppelzählungen zu vermeiden. Bei 29 Merkmalen ist die kognitive Belastung real – die Labelansicht verdichtet über Profile und Pflichtangaben und zeigt die vollständige Menge nur im Katalog.", "fr": "La liste de la TS 5723 n'étant pas exhaustive, des caractéristiques issues du marché ou de la réglementation sont ajoutées, mais marquées d'une référence « ext ». Une procédure de maintenance doit périodiquement revérifier les caractéristiques et les définitions au regard des révisions des normes (par ex. amendements relatifs à l'IA générative). Les caractéristiques corrélées (robustesse↔résilience↔fiabilité) sont délimitées par leur définition et leur méthode d'évaluation afin d'éviter les doubles comptages. Avec 29 caractéristiques, la charge cognitive est réelle — la vue étiquette condense l'information via les profils et les essentiels, l'ensemble complet n'étant exposé que dans le catalogue.", "es": "La lista de TS 5723 no es exhaustiva, por lo que se añaden características impulsadas por el mercado/la regulación, marcadas con una referencia 'ext'. Un procedimiento de mantenimiento debe volver a comprobar periódicamente las características y definiciones frente a las revisiones de las normas (p. ej., modificaciones relativas a la IA generativa). Las características correlacionadas (robustez↔resiliencia↔fiabilidad) se delimitan por definición y método de evaluación para evitar el doble cómputo. Con 29 características, la carga cognitiva es real: la vista de etiqueta comprime mediante perfiles e imprescindibles, y expone el conjunto completo solo en el catálogo."}}, {"need": {"ko": "선언이 신뢰받으려면 '무엇을·어떻게' 측정·문서화했는지의 근거가 있어야 한다. 각 기업이 자체 기준으로 선언하면 비교가 불가능하고 유리한 지표만 고르는 cherry-picking이 가능하다.", "en": "For a declaration to be trusted, there must be a basis for what and how it was measured and documented. If each company uses its own criteria, results are incomparable and open to cherry-picking.", "zh": "声明要被信任，须有「测量了什么·如何测量·如何记录」的依据。各企业自定标准会导致不可比较，并可挑选有利指标(cherry-picking)。", "de": "Damit einer Erklärung vertraut werden kann, muss eine Grundlage dafür bestehen, was und wie gemessen und dokumentiert wurde. Wenn jedes Unternehmen eigene Kriterien verwendet, sind die Ergebnisse nicht vergleichbar und anfällig für Cherry-Picking.", "fr": "Pour qu'une déclaration soit digne de confiance, il faut une base établissant ce qui a été mesuré et documenté, et comment. Si chaque entreprise utilise ses propres critères, les résultats sont incomparables et exposés à la sélection opportuniste.", "es": "Para que una declaración sea creíble, debe existir una base sobre qué se midió y documentó y cómo. Si cada empresa utiliza sus propios criterios, los resultados no son comparables y se prestan a la selección interesada."}, "guide": {"ko": "각 항목의 ① 지표 ② 측정법 ③ 문서화는 JTC 1/SC 42가 개발·제정한 표준의 요구사항에 근거해야 한다. 정량 항목은 표준이 정한 방법으로 측정하고, benchmark 등 객관 지표로 검증가능해야 한다.", "en": "Each item's (1) indicators, (2) measurement methods and (3) documentation must be grounded in the requirements of standards developed and published by JTC 1/SC 42. Quantitative items are measured by the standard's method and must be verifiable with objective indicators such as benchmarks.", "zh": "各项的①指标②测量方法③文档须以 JTC 1/SC 42 开发并制定的标准要求为据。定量项按标准规定方法测量，并须以基准等客观指标可验证。", "de": "(1) Indikatoren, (2) Messverfahren und (3) Dokumentation jedes Elements müssen auf den Anforderungen der von JTC 1/SC 42 entwickelten und veröffentlichten Normen beruhen. Quantitative Elemente werden nach dem Verfahren der Norm gemessen und müssen mit objektiven Indikatoren wie Benchmarks verifizierbar sein.", "fr": "(1) Les indicateurs, (2) les méthodes de mesure et (3) la documentation de chaque élément doivent être fondés sur les exigences des normes élaborées et publiées par le JTC 1/SC 42. Les éléments quantitatifs sont mesurés selon la méthode de la norme et doivent être vérifiables au moyen d'indicateurs objectifs tels que des benchmarks.", "es": "Los (1) indicadores, (2) métodos de medición y (3) documentación de cada elemento deben fundamentarse en los requisitos de las normas elaboradas y publicadas por JTC 1/SC 42. Los elementos cuantitativos se miden con el método de la norma y deben ser verificables con indicadores objetivos, como los benchmarks."}, "impl": {"ko": "구현은 3층이다. ① 데이터 층: claims.csv의 standards_linkage 컬럼과 스키마의 claim.standardRef·measurement.standardRef 필드로 모든 항목·측정이 근거 표준을 지목한다(예: 정확도→TS 4213, 견고성→24029, 레드팀→TS 42119-7). ② 검증 층: 정량 측정에는 벤치마크 ID·버전·sha256 해시·측정일·프로토콜(C1~C7 표시단서) 메타데이터를 요구해 재현·대조가 가능하게 한다. ③ 유지 층: SC 42 공식 카탈로그(80 표준)와 연계 현황을 SC42_GAP_ANALYSIS.md로 전수 대조해 59개 표준을 연계했고, 미발행 표준은 단계(WD/CD/DIS)를 함께 표기한다. 'SC 42 표준' 뷰가 표준↔특성↔claim 연관을 목록/카드/ID로 시각화한다.", "en": "Implementation has three layers. (1) Data: the standards_linkage column of claims.csv and the schema's claim.standardRef / measurement.standardRef make every item and measurement point to its governing standard (accuracy→TS 4213, robustness→24029, red teaming→TS 42119-7). (2) Verification: quantitative measurements require benchmark ID, version, sha256 hash, date and protocol (the C1–C7 qualifiers) so they can be reproduced and cross-checked. (3) Maintenance: the full SC 42 catalogue (80 standards) is cross-checked in SC42_GAP_ANALYSIS.md — 59 standards linked so far — and unpublished standards carry their stage (WD/CD/DIS). The 'SC 42 Standards' view visualizes standard↔characteristic↔claim links as list/card/ID.", "zh": "实现分三层。①数据层：claims.csv 的 standards_linkage 列与架构的 claim.standardRef·measurement.standardRef，使每项与测量指向其依据标准(准确性→TS 4213、鲁棒性→24029、红队→TS 42119-7)；②验证层：定量测量要求基准 ID·版本·sha256 哈希·测量日·协议(C1~C7 限定语)元数据，可复现·可对照；③维护层：以 SC42_GAP_ANALYSIS.md 全面对照 SC 42 官方目录(80 项标准)，已关联 59 项，未发布标准标注阶段(WD/CD/DIS)。「SC 42 标准」视图以列表/卡片/ID 可视化标准↔特性↔claim 关联。", "de": "Die Umsetzung erfolgt auf drei Ebenen. (1) Daten: Die Spalte standards_linkage in claims.csv sowie claim.standardRef / measurement.standardRef im Schema lassen jedes Element und jede Messung auf die maßgebliche Norm verweisen (Genauigkeit→TS 4213, Robustheit→24029, Red Teaming→TS 42119-7). (2) Verifizierung: Quantitative Messungen erfordern Benchmark-ID, Version, sha256-Hash, Datum und Protokoll (die Qualifikatoren C1–C7), damit sie reproduziert und gegengeprüft werden können. (3) Pflege: Der vollständige SC-42-Katalog (80 Normen) wird in SC42_GAP_ANALYSIS.md gegengeprüft – bislang sind 59 Normen verknüpft –, und unveröffentlichte Normen tragen ihr Stadium (WD/CD/DIS). Die Ansicht „SC-42-Normen“ visualisiert die Verknüpfungen Norm↔Merkmal↔Claim als Liste/Karte/ID.", "fr": "La mise en œuvre comporte trois couches. (1) Données : la colonne standards_linkage de claims.csv et les champs claim.standardRef / measurement.standardRef du schéma rattachent chaque élément et chaque mesure à sa norme de référence (exactitude→TS 4213, robustesse→24029, red teaming→TS 42119-7). (2) Vérification : les mesures quantitatives exigent l'identifiant, la version, le hachage sha256, la date et le protocole du benchmark (les qualificatifs C1–C7) afin de pouvoir être reproduites et recoupées. (3) Maintenance : le catalogue complet du SC 42 (80 normes) est recoupé dans SC42_GAP_ANALYSIS.md — 59 normes reliées à ce jour — et les normes non publiées indiquent leur stade (WD/CD/DIS). La vue « Normes du SC 42 » visualise les liens norme↔caractéristique↔claim sous forme de liste/fiches/ID.", "es": "La implementación tiene tres capas. (1) Datos: la columna standards_linkage de claims.csv y los campos claim.standardRef / measurement.standardRef del esquema hacen que cada elemento y cada medición apunten a su norma de referencia (exactitud→TS 4213, robustez→24029, red teaming→TS 42119-7). (2) Verificación: las mediciones cuantitativas exigen ID del benchmark, versión, hash sha256, fecha y protocolo (los calificadores C1–C7) para que puedan reproducirse y contrastarse. (3) Mantenimiento: el catálogo completo de SC 42 (80 normas) se contrasta en SC42_GAP_ANALYSIS.md —59 normas vinculadas hasta la fecha— y las normas no publicadas indican su etapa (WD/CD/DIS). La vista 'Normas de SC 42' visualiza los vínculos norma↔característica↔claim como lista/tarjeta/ID."}, "consider": {"ko": "SC 42 표준 상당수가 개발중이므로 발행 전 인용은 단계를 표기하고 발행 시 갱신하는 절차를 운영해야 하며, SC 42의 분기별 신규 NP/AWI를 모니터링해 갭 분석을 재대조한다. 벤치마크는 데이터 오염(contamination)·포화(saturation)·버전 드리프트가 있으므로 해시·측정일 표기를 강제하고 주기적으로 벤치 세트를 교체·오염 점검한다. 벤치마크가 없는 항목(탄소회계 등)은 표준 자체 측정법을 쓰고, 표준이 아직 없는 신흥 영역(에이전트 안전 등)은 잠정 지표로 선언하되 표준화 필요성을 명시해 역으로 표준 제정에 기고한다(역기여).", "en": "Many SC 42 standards are under development, so pre-publication citations carry their stage and are updated on publication, and the quarterly stream of new NP/AWI items is monitored to refresh the gap analysis. Benchmarks suffer contamination, saturation and version drift, so hash/date are mandatory and benchmark suites are periodically rotated and contamination-checked. Items without a benchmark (e.g., carbon accounting) use the standard's own method, and emerging areas without a standard yet (e.g., agent safety) are declared with provisional indicators while explicitly flagging the standardization need — contributing back to standards development.", "zh": "许多 SC 42 标准仍在制定中，发布前引用须标注阶段并于发布时更新，且须监测 SC 42 每季新增 NP/AWI 以刷新差距分析。基准存在污染(contamination)·饱和(saturation)·版本漂移，故强制哈希·测量日标注，并定期轮换基准集·做污染检查。无基准的项(如碳核算)用标准自身方法；尚无标准的新兴领域(如智能体安全)以临时指标声明并明示标准化需求，反向贡献于标准制定。", "de": "Viele SC-42-Normen befinden sich in Entwicklung; daher tragen Zitate vor der Veröffentlichung ihr Stadium und werden bei Veröffentlichung aktualisiert, und der vierteljährliche Zustrom neuer NP/AWI-Projekte wird beobachtet, um die Lückenanalyse zu aktualisieren. Benchmarks leiden unter Kontamination, Sättigung und Versionsdrift; daher sind Hash/Datum verpflichtend, und Benchmark-Suites werden regelmäßig rotiert und auf Kontamination geprüft. Elemente ohne Benchmark (z. B. CO2-Bilanzierung) verwenden das Verfahren der Norm selbst, und neue Bereiche, für die noch keine Norm existiert (z. B. Agentensicherheit), werden mit vorläufigen Indikatoren deklariert, wobei der Normungsbedarf ausdrücklich gekennzeichnet wird – als Rückbeitrag zur Normentwicklung.", "fr": "De nombreuses normes du SC 42 sont en cours d'élaboration ; les citations antérieures à la publication indiquent donc leur stade et sont mises à jour lors de la publication, et le flux trimestriel de nouveaux sujets NP/AWI est suivi afin d'actualiser l'analyse des écarts. Les benchmarks souffrent de contamination, de saturation et de dérive des versions ; le hachage et la date sont donc obligatoires, et les suites de benchmarks font l'objet d'une rotation et de contrôles de contamination périodiques. Les éléments sans benchmark (par ex. la comptabilité carbone) utilisent la méthode propre à la norme, et les domaines émergents encore dépourvus de norme (par ex. la sécurité des agents) sont déclarés avec des indicateurs provisoires tout en signalant explicitement le besoin de normalisation — contribuant ainsi en retour à l'élaboration des normes.", "es": "Muchas normas de SC 42 están en desarrollo, por lo que las citas previas a la publicación indican su etapa y se actualizan al publicarse, y se vigila el flujo trimestral de nuevos elementos NP/AWI para actualizar el análisis de brechas. Los benchmarks sufren contaminación, saturación y deriva de versiones, por lo que el hash y la fecha son obligatorios y los conjuntos de benchmarks se rotan periódicamente y se comprueba su contaminación. Los elementos sin benchmark (p. ej., la contabilidad de carbono) utilizan el método propio de la norma, y las áreas emergentes que aún carecen de norma (p. ej., la seguridad de los agentes) se declaran con indicadores provisionales señalando explícitamente la necesidad de normalización, lo que contribuye a su vez al desarrollo de normas."}}, {"need": {"ko": "정보가 아무리 정확해도 시장 행위자가 의사결정에 실제로 쓰지 않으면 수요·공급을 움직이지 못한다. 공급자 관점의 정보 나열은 인지 과부하만 낳는다.", "en": "However accurate, information that market actors do not actually use in decisions cannot move supply and demand; a provider-centric list of facts only causes cognitive overload.", "zh": "信息再准确，若市场行为者不在决策中实际使用，也无法撬动供需；以供应商视角罗列信息只会造成认知过载。", "de": "So genau sie auch sein mögen: Informationen, die Marktakteure in ihren Entscheidungen tatsächlich nicht nutzen, können Angebot und Nachfrage nicht bewegen; eine anbieterzentrierte Faktenliste führt lediglich zu kognitiver Überlastung.", "fr": "Aussi exacte soit-elle, une information que les acteurs du marché n'utilisent pas réellement dans leurs décisions ne peut pas faire évoluer l'offre et la demande ; une liste de faits centrée sur le fournisseur ne provoque qu'une surcharge cognitive.", "es": "Por exacta que sea, la información que los actores del mercado no utilizan realmente en sus decisiones no puede mover la oferta y la demanda; una lista de datos centrada en el proveedor solo provoca sobrecarga cognitiva."}, "guide": {"ko": "선언 항목은 사용자·제조사(OEM)·개발사·개발자·규제기관·구매자가 구매·통합·감독·조달 의사결정에서 실제로 필요로 하는 정보를 우선으로 선정하고, 각 항목이 '누구의 어떤 결정에 쓰이는지'를 명확히 한다.", "en": "Declared items are prioritized by what users, manufacturers/OEMs, developers, integrators, regulators and buyers actually need in their buy, integrate, oversee and procure decisions, making clear whose decision each item serves.", "zh": "声明项以用户·制造商(OEM)·开发商·集成者·监管机构·采购方在购买·集成·监督·采购决策中真正需要的信息为优先，并明确每一项「服务于谁的何种决策」。", "de": "Deklarierte Elemente werden danach priorisiert, was Nutzer, Hersteller/OEMs, Entwickler, Integratoren, Aufsichtsbehörden und Käufer für ihre Kauf-, Integrations-, Aufsichts- und Beschaffungsentscheidungen tatsächlich benötigen, wobei klargestellt wird, wessen Entscheidung jedes Element dient.", "fr": "Les éléments déclarés sont hiérarchisés selon ce dont les utilisateurs, les fabricants/OEM, les développeurs, les intégrateurs, les régulateurs et les acheteurs ont réellement besoin pour leurs décisions d'achat, d'intégration, de supervision et de passation de marchés, en précisant clairement la décision servie par chaque élément.", "es": "Los elementos declarados se priorizan según lo que usuarios, fabricantes/OEM, desarrolladores, integradores, reguladores y compradores necesitan realmente en sus decisiones de compra, integración, supervisión y contratación, dejando claro a qué decisión sirve cada elemento."}, "impl": {"ko": "6주체×89 claim의 수요 매트릭스를 구축해(각 셀 0~3 필요 강도, demand.json) 항목마다 '누가 얼마나 필요로 하는가'를 데이터화했고, 항목별 지배적 효용(어느 행위자의 어떤 결정에 쓰이는지)을 한 문장으로 서술했다. 대시보드에서는 ① '이해관계자' 뷰의 히트맵 매트릭스, ② 카탈로그의 행위자 필터, ③ 상세 모달의 행위자 필요성(◎○△·)·지배적 효용으로 노출한다. 소비자 접점에서는 인지부하를 줄이기 위해 유형별 must-know 5만 전면(FOP)에 노출하고 전체 패널은 후면(B2B 뷰)에 둔다.", "en": "A demand matrix of six actors × 89 claims was built (each cell scored 0–3, demand.json), quantifying who needs each item and how much, with a one-line dominant utility (whose decision it serves) per item. The dashboard exposes this via (1) the Stakeholders heat-map matrix, (2) actor filters in the catalog, and (3) per-item actor-necessity (◎○△·) and dominant utility in the detail modal. At the consumer touchpoint, only the per-type must-know 5 appear front-of-pack to limit cognitive load, with the full panel on the back (B2B view).", "zh": "构建六方×89 claim 的需求矩阵(每格 0~3 强度，demand.json)，将「谁·多需要」数据化，并为每项撰写一句主导效用(服务于谁的何种决策)。仪表板经①「利益相关方」视图热力矩阵、②目录的行为者筛选、③详情弹窗的行为者必要性(◎○△·)与主导效用展示。消费者接触点上，为降低认知负荷仅前置各类型 must-know 5，完整面板置于后置(B2B 视图)。", "de": "Es wurde eine Bedarfsmatrix aus sechs Akteuren × 89 Claims erstellt (jede Zelle mit 0–3 bewertet, demand.json), die quantifiziert, wer jedes Element in welchem Umfang benötigt, mit einem einzeiligen dominanten Nutzen (welcher Entscheidung es dient) pro Element. Das Dashboard stellt dies dar über (1) die Heatmap-Matrix „Stakeholder“, (2) Akteurfilter im Katalog und (3) die Akteursnotwendigkeit pro Element (◎○△·) und den dominanten Nutzen im Detaildialog. Am Verbraucherkontaktpunkt erscheinen nur die 5 typspezifischen Pflichtangaben auf der Vorderseite (Front-of-Pack), um die kognitive Belastung zu begrenzen; das vollständige Feld steht auf der Rückseite (B2B-Ansicht).", "fr": "Une matrice de demande de six acteurs × 89 claims a été construite (chaque cellule notée de 0 à 3, demand.json), quantifiant qui a besoin de chaque élément et dans quelle mesure, avec une utilité dominante en une ligne (la décision qu'il sert) par élément. Le tableau de bord l'expose via (1) la matrice de chaleur des parties prenantes, (2) les filtres par acteur dans le catalogue et (3) la nécessité par acteur (◎○△·) et l'utilité dominante de chaque élément dans la fenêtre de détail. Au point de contact avec le consommateur, seuls les 5 essentiels propres à chaque type figurent en face avant afin de limiter la charge cognitive, le panneau complet figurant au dos (vue B2B).", "es": "Se construyó una matriz de demanda de seis actores × 89 claims (cada celda puntuada de 0 a 3, demand.json), que cuantifica quién necesita cada elemento y en qué medida, con una utilidad dominante de una línea (a qué decisión sirve) por elemento. El panel lo expone mediante (1) la matriz de mapa de calor de partes interesadas, (2) filtros por actor en el catálogo y (3) la necesidad por actor (◎○△·) y la utilidad dominante de cada elemento en el modal de detalle. En el punto de contacto con el consumidor, solo los 5 imprescindibles por tipo aparecen en la parte frontal (front-of-pack) para limitar la carga cognitiva, con el panel completo en el reverso (vista B2B)."}, "consider": {"ko": "행위자별 needs는 상충한다 — 구매자·규제기관은 상세·전수 정보를, 일반 사용자는 3~5개 신호만 소화한다. 전면 must-know/후면 전체 패널의 2단 구조로 절충하되, must-know 선정이 또 다른 cherry-picking이 되지 않도록 유형별 고정 큐레이션으로 통제한다. 수요 강도 점수는 전문가 판단 기반이므로 실제 사용·조달 데이터로 주기 보정이 필요하다. 지역·도메인별로 needs가 달라(EU DSA의 추천 투명성 등) 규제 뷰·프로파일로 국지화하며, B2C 사용자는 라벨을 접할 기회 자체가 없을 수 있으므로 구매·가입 접점에 라벨을 노출하는 유통 설계가 별도로 필요하다.", "en": "Actor needs conflict — buyers and regulators want exhaustive detail while end users digest only 3–5 signals. The two-tier front-must-know / back-full-panel structure balances this, and must-know selection is controlled by fixed per-type curation so it does not become another form of cherry-picking. Demand scores are expert judgments and need periodic calibration against real usage and procurement data. Needs vary by region and domain (e.g., EU DSA recommender transparency), localized via the Regulatory view and profiles; and since B2C users may never encounter the label at all, separate distribution design is needed to surface it at purchase/sign-up touchpoints.", "zh": "各行为者需求相互冲突——采购方·监管要求详尽，而最终用户只消化 3~5 个信号。以前置 must-know/后置完整面板的两层结构平衡，且 must-know 由各类型固定策划控制，以免沦为另一种 cherry-picking。需求强度评分基于专家判断，须以实际使用·采购数据周期校准。需求因地区·领域而异(如 EU DSA 推荐透明性)，经法规视图·配置本地化；且 B2C 用户可能根本接触不到标签，须另行设计在购买·注册接触点的曝光。", "de": "Zielkonflikt zwischen Akteursbedürfnissen – Käufer und Aufsichtsbehörden wünschen erschöpfende Details, während Endnutzer nur 3–5 Signale aufnehmen. Die zweistufige Struktur aus Pflichtangaben auf der Vorderseite und vollständigem Feld auf der Rückseite gleicht dies aus, und die Auswahl der Pflichtangaben wird durch eine feste typspezifische Kuratierung gesteuert, damit sie nicht zu einer weiteren Form des Cherry-Picking wird. Bedarfswerte sind Experteneinschätzungen und müssen regelmäßig anhand realer Nutzungs- und Beschaffungsdaten kalibriert werden. Bedürfnisse variieren nach Region und Domäne (z. B. Transparenz von Empfehlungssystemen nach EU DSA) und werden über die Regulierungsansicht und Profile lokalisiert; und da B2C-Nutzer dem Label womöglich nie begegnen, ist ein gesondertes Verbreitungskonzept erforderlich, um es an Kauf- bzw. Anmeldekontaktpunkten sichtbar zu machen.", "fr": "Conflit entre les besoins des acteurs — les acheteurs et les régulateurs veulent un niveau de détail exhaustif tandis que les utilisateurs finaux n'assimilent que 3 à 5 signaux. La structure à deux niveaux (essentiels en face avant / panneau complet au dos) équilibre ces besoins, et la sélection des essentiels est encadrée par une curation fixe par type afin qu'elle ne devienne pas une autre forme de sélection opportuniste. Les scores de demande sont des jugements d'experts et doivent être périodiquement recalibrés au regard des données réelles d'utilisation et d'achat. Les besoins varient selon la région et le domaine (par ex. transparence des systèmes de recommandation au titre du DSA de l'UE) ; ils sont localisés via la vue réglementaire et les profils ; et comme les utilisateurs B2C peuvent ne jamais rencontrer l'étiquette, une conception de diffusion distincte est nécessaire pour la faire apparaître aux points de contact d'achat/d'inscription.", "es": "Conflicto de necesidades entre actores: compradores y reguladores quieren un detalle exhaustivo, mientras que los usuarios finales solo asimilan entre 3 y 5 señales. La estructura de dos niveles —imprescindibles en el anverso / panel completo en el reverso— equilibra esto, y la selección de imprescindibles se controla mediante una curación fija por tipo para que no se convierta en otra forma de selección interesada (cherry-picking). Las puntuaciones de demanda son juicios de expertos y requieren una calibración periódica con datos reales de uso y contratación. Las necesidades varían según la región y el dominio (p. ej., transparencia de los sistemas de recomendación según la DSA de la UE), y se localizan mediante la vista Regulatoria y los perfiles; y, como es posible que los usuarios B2C nunca lleguen a ver la etiqueta, se necesita un diseño de distribución específico que la muestre en los puntos de compra/registro."}}, {"need": {"ko": "신뢰성 정보는 상황에 따라 요구되는 검증 강도와 표현 형식이 다르다. 자기선언만으로는 고위험 조달을 뒷받침할 수 없고, 모든 것을 제3자 인증으로 요구하면 진입장벽이 과도하다.", "en": "Trustworthiness information requires different verification rigor and presentation by context; self-declaration alone cannot underwrite high-risk procurement, while requiring third-party certification for everything raises an excessive barrier.", "zh": "可信性信息所需的验证强度与呈现形式因情境而异；仅凭自我声明无法支撑高风险采购，而对一切都要求第三方认证则门槛过高。", "de": "Informationen zur Vertrauenswürdigkeit erfordern je nach Kontext unterschiedliche Verifizierungsstrenge und Darstellung; eine Selbsterklärung allein kann keine Hochrisiko-Beschaffung tragen, während eine Pflicht zur Zertifizierung durch Dritte für alles eine übermäßige Hürde errichtet.", "fr": "Les informations sur le caractère digne de confiance exigent une rigueur de vérification et une présentation différentes selon le contexte ; l'autodéclaration seule ne peut garantir les achats à haut risque, tandis qu'exiger une certification par une tierce partie pour tout élève une barrière excessive.", "es": "La información sobre confiabilidad requiere un rigor de verificación y una presentación distintos según el contexto; la autodeclaración por sí sola no puede respaldar la contratación de alto riesgo, mientras que exigir certificación por terceros para todo eleva una barrera excesiva."}, "guide": {"ko": "환경라벨(ISO 14020 계열)이 검증 메커니즘에 따라 유형을 나눈 원리를 채택·확장한다: Type I 제3자 인증(14024형)·Type II 자기선언(14021형)·Type III 생애주기 정량 선언(LCA/EPD, 14025형). 여기에 AI 특유의 Type IV 개발자 기술카드(DTC)를 추가한다.", "en": "We adopt and extend the eco-label (ISO 14020) principle of typing labels by verification mechanism: Type I third-party certified (14024-style), Type II self-declared (14021-style), Type III lifecycle quantitative declaration (LCA/EPD, 14025-style), plus an AI-specific Type IV developer technical card (DTC).", "zh": "采用并扩展环境标签(ISO 14020 系列)按验证机制分型的原理：Type I 第三方认证(14024 型)·Type II 自我声明(14021 型)·Type III 生命周期定量声明(LCA/EPD，14025 型)，并增设 AI 特有的 Type IV 开发者技术卡(DTC)。", "de": "Wir übernehmen und erweitern das Prinzip der Umweltzeichen (ISO 14020), Labels nach Verifizierungsmechanismus zu typisieren: Type I durch Dritte zertifiziert (nach Art von 14024), Type II selbst erklärt (nach Art von 14021), Type III quantitative Lebenszyklusdeklaration (LCA/EPD, nach Art von 14025) sowie eine KI-spezifische Type IV Developer Technical Card (DTC).", "fr": "Nous adoptons et étendons le principe des écolabels (ISO 14020) consistant à classer les étiquettes par type selon le mécanisme de vérification : Type I certifié par une tierce partie (à la manière de 14024), Type II autodéclaré (à la manière de 14021), Type III déclaration quantitative du cycle de vie (ACV/EPD, à la manière de 14025), ainsi qu'un Type IV propre à l'IA, la fiche technique développeur (DTC).", "es": "Adoptamos y ampliamos el principio de las ecoetiquetas (ISO 14020) de tipificar las etiquetas según el mecanismo de verificación: Type I certificada por terceros (estilo 14024), Type II autodeclarada (estilo 14021), Type III declaración cuantitativa del ciclo de vida (ACV/EPD, estilo 14025), más un Type IV específico de la IA, la ficha técnica del desarrollador (DTC)."}, "impl": {"ko": "각 Type을 환경라벨 원리 그대로 운영 규칙화했다. Type I은 홀리스틱 씰 원리에 따라 전 claim L3(baseline까지 인증기관 확인, 인증기관·인증번호·범위·유효기간 필수), Type II는 à la carte 원리에 따라 입증 가능한 소수의 구체 claim만 선언(baseline floor + 항목별 구체성·비모호·입증자료), Type III는 EPD 원리에 따라 범주규칙(PCR analog=SC 42 평가표준)·선언단위·프로그램 운영자·등록번호·독립검증·비교면책을 갖춘 정량선언(quantitativeDeclaration 블록), Type IV는 model card의 전 섹션을 포함하되 검증등급·변조내성·다운스트림·기계가독을 더한 DTC로 구현했다. 4개 Type 예제가 렌더러에 있고, 운영원칙은 TFL_TYPES.md, Type 불변식(I=전 L3, III=EPD 블록, IV=model card 항목+비교표)은 test_examples.py가 자동 검증한다.", "en": "Each Type is codified exactly on the eco-label principle. Type I: a holistic seal — every claim L3 (even the baseline is certifier-confirmed; certifier, certificate no., scope, validity required). Type II: à la carte — only a few substantiable, specific claims (baseline floor + per-claim specificity, non-vagueness, evidence on hand). Type III: EPD-style — a quantitative declaration with category rules (PCR analog = SC 42 evaluation standards), declared unit, program operator, registration no., independent verification and comparability disclaimer (the quantitativeDeclaration block). Type IV: a DTC covering all model-card sections plus verification tiers, tamper-evident wording, downstream info and machine readability. All four Type examples live in the renderer, operating principles in TFL_TYPES.md, and Type invariants (I=all L3, III=EPD block, IV=model-card items+comparison) are auto-checked by test_examples.py.", "zh": "将各 Type 按环保标签原理规则化。Type I 为整体印章——全 claim L3(连 baseline 亦由认证机构确认；机构·证书号·范围·有效期必填)；Type II 为 à la carte——仅声明可证实的少数具体 claim(baseline 底线+逐项具体·不含糊·备有证据)；Type III 为 EPD 型——具类别规则(PCR 类比=SC 42 评估标准)·声明单位·项目运营方·注册号·独立验证·可比性免责的定量声明(quantitativeDeclaration 块)；Type IV 为涵盖模型卡全部分节并增加验证等级·防篡改·下游·机器可读的 DTC。四种 Type 示例在渲染器中，运营原则见 TFL_TYPES.md，Type 不变式(I=全 L3、III=EPD 块、IV=模型卡项+对比表)由 test_examples.py 自动校验。", "de": "Jeder Type ist exakt nach dem Umweltzeichen-Prinzip kodifiziert. Type I: ein ganzheitliches Siegel – jeder Claim L3 (selbst die Basisanforderungen sind vom Zertifizierer bestätigt; Zertifizierer, Zertifikatsnr., Geltungsbereich, Gültigkeit erforderlich). Type II: à la carte – nur wenige substantiierbare, spezifische Claims (Basisuntergrenze + Spezifität pro Claim, Eindeutigkeit, vorliegende Nachweise). Type III: nach Art einer EPD – eine quantitative Deklaration mit Kategorieregeln (PCR-Entsprechung = SC-42-Bewertungsnormen), deklarierter Einheit, Programmbetreiber, Registriernummer, unabhängiger Verifizierung und Vergleichbarkeitshinweis (der Block quantitativeDeclaration). Type IV: eine DTC, die alle Model-Card-Abschnitte sowie Verifizierungsstufen, manipulationsfeste Formulierungen, nachgelagerte Informationen und Maschinenlesbarkeit abdeckt. Alle vier Type-Beispiele befinden sich im Renderer, die Funktionsprinzipien in TFL_TYPES.md, und die Type-Invarianten (I=alle L3, III=EPD-Block, IV=Model-Card-Elemente+Vergleich) werden durch test_examples.py automatisch geprüft.", "fr": "Chaque Type est codifié exactement selon le principe des écolabels. Type I : un label global — chaque claim est L3 (même le socle est confirmé par le certificateur ; certificateur, n° de certificat, périmètre et validité requis). Type II : à la carte — seulement quelques claims spécifiques et justifiables (socle minimal + spécificité par claim, absence d'imprécision, preuves disponibles). Type III : à la manière d'une EPD — une déclaration quantitative avec des règles de catégorie (analogue des PCR = normes d'évaluation du SC 42), une unité déclarée, un opérateur de programme, un n° d'enregistrement, une vérification indépendante et un avertissement sur la comparabilité (le bloc quantitativeDeclaration). Type IV : une DTC couvrant toutes les sections d'une fiche de modèle, plus les niveaux de vérification, une formulation vérifiable, des informations en aval et la lisibilité par machine. Les quatre exemples de Type figurent dans le moteur de rendu, les principes de fonctionnement dans TFL_TYPES.md, et les invariants de Type (I = tout L3, III = bloc EPD, IV = éléments de fiche de modèle + comparaison) sont vérifiés automatiquement par test_examples.py.", "es": "Cada Type se codifica exactamente según el principio de las ecoetiquetas. Type I: un sello integral; todos los claims son L3 (incluso la base mínima está confirmada por el certificador; se exigen certificador, n.º de certificado, alcance y vigencia). Type II: a la carta; solo unos pocos claims específicos y fundamentables (base mínima + especificidad por claim, ausencia de vaguedad, evidencia disponible). Type III: estilo EPD; una declaración cuantitativa con reglas de categoría (análogo de PCR = normas de evaluación de SC 42), unidad declarada, operador del programa, n.º de registro, verificación independiente y descargo de comparabilidad (el bloque quantitativeDeclaration). Type IV: una DTC que cubre todas las secciones de una model card más niveles de verificación, redacción a prueba de manipulaciones, información aguas abajo y legibilidad por máquina. Los ejemplos de los cuatro Types se encuentran en el renderizador, los principios de funcionamiento en TFL_TYPES.md, y los invariantes de cada Type (I=todo L3, III=bloque EPD, IV=elementos de model card+comparación) se comprueban automáticamente con test_examples.py."}, "consider": {"ko": "Type은 라벨 전체 속성이므로 claim의 tfl_type(기본형)과 라벨 Type을 혼동하지 않아야 한다 — Type I 라벨에서는 평소 자기선언인 claim도 L3가 된다. Type III의 ATFS/QFD 정량 V&V 프로토콜과 Type IV의 DTC 스키마는 42117-X에서 확립 중이므로 예제 수준으로 제시하고 표준 제정에 맞춰 갱신한다. Type I은 인증기관 생태계(42006 인정 체계)가 성숙해야 작동하므로 초기에는 Type II/III 중심으로 시작하고, Type II→III→I로 검증 강도를 올려가는 업그레이드 경로를 제공해 잠금 효과 없이 성장하게 한다.", "en": "Type is a whole-label property — a claim's tfl_type (its native form) must not be confused with the label's Type; in a Type I label even normally self-declared claims become L3. Type III's ATFS/QFD protocol and Type IV's DTC schema are still being established in 42117-X, so they are presented at example level and updated as the standard matures. Type I needs a mature certifier ecosystem (42006 accreditation), so adoption starts with Types II/III, with an upgrade path II→III→I that raises rigor without lock-in.", "zh": "Type 是整个标签的属性——claim 的 tfl_type(其原生形态)不得与标签 Type 混淆；在 Type I 标签中平时自我声明的 claim 也成为 L3。Type III 的 ATFS/QFD 协议与 Type IV 的 DTC 架构仍在 42117-X 中确立，故以示例层级呈现并随标准成熟更新。Type I 需认证机构生态(42006 认可体系)成熟方可运作，故初期以 Type II/III 为主，并提供 II→III→I 逐级提升验证强度的升级路径，避免锁定。", "de": "Der Type ist eine Eigenschaft des gesamten Labels – der tfl_type eines Claims (seine native Form) darf nicht mit dem Type des Labels verwechselt werden; in einem Type-I-Label werden selbst üblicherweise selbst erklärte Claims zu L3. Das ATFS/QFD-Protokoll von Type III und das DTC-Schema von Type IV werden in 42117-X noch erarbeitet; sie werden daher auf Beispielebene dargestellt und mit der Reifung der Norm aktualisiert. Type I benötigt ein ausgereiftes Ökosystem von Zertifizierern (Akkreditierung nach 42006); die Einführung beginnt daher mit Type II/III, mit einem Upgrade-Pfad II→III→I, der die Strenge ohne Lock-in erhöht.", "fr": "Le Type est une propriété de l'étiquette entière — le tfl_type d'un claim (sa forme native) ne doit pas être confondu avec le Type de l'étiquette ; dans une étiquette Type I, même les claims normalement autodéclarés deviennent L3. Le protocole ATFS/QFD du Type III et le schéma DTC du Type IV sont encore en cours d'élaboration dans la 42117-X ; ils sont donc présentés au niveau des exemples et mis à jour à mesure que la norme mûrit. Le Type I nécessite un écosystème de certificateurs mature (accréditation 42006) ; l'adoption commence donc par les Types II/III, avec une trajectoire de montée en gamme II→III→I qui renforce la rigueur sans effet de verrouillage.", "es": "El Type es una propiedad de la etiqueta en su conjunto: el tfl_type de un claim (su forma nativa) no debe confundirse con el Type de la etiqueta; en una etiqueta Type I, incluso los claims normalmente autodeclarados pasan a ser L3. El protocolo ATFS/QFD de Type III y el esquema DTC de Type IV aún se están estableciendo en 42117-X, por lo que se presentan a nivel de ejemplo y se actualizan a medida que madura la norma. Type I necesita un ecosistema de certificadores maduro (acreditación 42006), por lo que la adopción comienza con los Types II/III, con una vía de mejora II→III→I que eleva el rigor sin dependencia cautiva."}}, {"need": {"ko": "AI 신뢰성은 학습데이터 생성부터 개발·유통·운영·폐기까지 각 단계에서 형성되고 훼손된다. 배포 시점의 단일 지표만으로는 전 과정의 영향을 알 수 없다.", "en": "AI trustworthiness is formed and eroded at every stage — from training-data generation through development, distribution, operation and retirement; a single metric at deployment cannot reveal lifecycle-wide impact.", "zh": "AI 可信性从训练数据生成到开发·流通·运营·退役的各阶段被塑造与损害；仅凭部署时点的单一指标无法把握全过程的影响。", "de": "KI-Vertrauenswürdigkeit wird in jeder Phase aufgebaut und abgebaut – von der Erzeugung der Trainingsdaten über Entwicklung, Vertrieb und Betrieb bis zur Außerbetriebnahme; eine einzelne Kennzahl beim Inverkehrbringen kann die Auswirkungen über den gesamten Lebenszyklus nicht abbilden.", "fr": "Le caractère digne de confiance de l'IA se construit et s'érode à chaque étape — de la génération des données d'entraînement au développement, à la distribution, à l'exploitation et au retrait ; une mesure unique au moment du déploiement ne peut révéler l'impact sur l'ensemble du cycle de vie.", "es": "La confiabilidad de la IA se forma y se erosiona en cada etapa —desde la generación de los datos de entrenamiento hasta el desarrollo, la distribución, la operación y la retirada—; una única métrica en el despliegue no puede revelar el impacto en todo el ciclo de vida."}, "guide": {"ko": "생성→개발→유통→사용→폐기 전 생애주기에서 신뢰성에 미치는 영향을 효과적으로 표시할 수 있어야 한다. 데이터 품질·탄소·정확도·견고성·공정성·설명·안전·보안·프라이버시·삭제 등 생애주기 전반의 영향 범주를 다룬다.", "en": "The label must effectively display trustworthiness impact across the full lifecycle — generation → development → distribution → use → retirement — covering impact categories such as data quality, carbon, accuracy, robustness, fairness, explanation, safety, security, privacy and deletion.", "zh": "标签须能有效展示生成→开发→流通→使用→退役全生命周期对可信性的影响，涵盖数据质量·碳·准确性·鲁棒性·公平性·解释·安全·安全防护·隐私·删除等影响范畴。", "de": "Das Label muss die Auswirkungen auf die Vertrauenswürdigkeit über den gesamten Lebenszyklus – Erzeugung → Entwicklung → Vertrieb → Nutzung → Außerbetriebnahme – wirksam darstellen und dabei Wirkungskategorien wie Datenqualität, CO2, Genauigkeit, Robustheit, Fairness, Erklärung, Sicherheit, IT-Sicherheit, Privatsphäre und Löschung abdecken.", "fr": "L'étiquette doit afficher efficacement l'impact sur le caractère digne de confiance tout au long du cycle de vie — génération → développement → distribution → utilisation → retrait — en couvrant des catégories d'impact telles que la qualité des données, le carbone, l'exactitude, la robustesse, l'équité, l'explication, la sûreté, la sécurité, la vie privée et l'effacement.", "es": "La etiqueta debe mostrar de forma eficaz el impacto en la confiabilidad a lo largo de todo el ciclo de vida —generación → desarrollo → distribución → uso → retirada—, abarcando categorías de impacto como calidad de los datos, carbono, exactitud, robustez, equidad, explicación, seguridad (safety), seguridad (security), privacidad y eliminación."}, "impl": {"ko": "환경 LCA의 영향범주 개념을 이식해 10대 AI 신뢰성 영향범주(①데이터 품질·대표성 ②탄소·자원 ③정확도 ④견고성 ⑤공정성 ⑥설명충실도 ⑦안전 ⑧보안 ⑨프라이버시·기억화 ⑩삭제·폐기)를 생애주기 단계(생성/개발/유통/사용/폐기)에 매핑하고, 각 범주를 담당 SC 42 표준(5259-2·TR 20226·TS 4213·24029·TR 24027·TS 6254·TS 42119-7·27090·27091·8183/5338)과 측정 벤치마크(MMLU·AdvGLUE·BBQ·HarmBench·MIA·TOFU 등)에 연결했다. 스키마에는 claim별 lifecycleStage(폐기=retirement 단계 신설)와 EPD형 quantitativeDeclaration 블록을 추가했고, Type III 예제가 이 구조로 렌더되며 카탈로그에도 수명주기 필터가 있다.", "en": "Porting the impact-category concept of environmental LCA, ten AI-trustworthiness impact categories (data quality/representativeness, carbon/resources, accuracy, robustness, fairness, explanation faithfulness, safety, security, privacy/memorization, deletion/retirement) are mapped to lifecycle stages (generation/development/distribution/use/retirement), each tied to its governing SC 42 standard (5259-2, TR 20226, TS 4213, 24029, TR 24027, TS 6254, TS 42119-7, 27090, 27091, 8183/5338) and measurement benchmark (MMLU, AdvGLUE, BBQ, HarmBench, MIA, TOFU, …). The schema adds a per-claim lifecycleStage (with a new 'retirement' stage) and the EPD-style quantitativeDeclaration block; the Type III example renders this structure and the catalog offers a lifecycle filter.", "zh": "移植环境 LCA 的影响范畴概念，将 10 大 AI 可信性影响范畴(①数据质量·代表性 ②碳·资源 ③准确性 ④鲁棒性 ⑤公平性 ⑥解释忠实度 ⑦安全 ⑧安全防护 ⑨隐私·记忆化 ⑩删除·退役)映射到生命周期阶段(生成/开发/流通/使用/退役)，各范畴关联其主管 SC 42 标准(5259-2·TR 20226·TS 4213·24029·TR 24027·TS 6254·TS 42119-7·27090·27091·8183/5338)与测量基准(MMLU·AdvGLUE·BBQ·HarmBench·MIA·TOFU 等)。架构新增每 claim 的 lifecycleStage(新设退役=retirement)与 EPD 型 quantitativeDeclaration 块；Type III 示例按此结构渲染，目录亦有生命周期筛选。", "de": "In Übertragung des Konzepts der Wirkungskategorien aus der Umwelt-LCA werden zehn Wirkungskategorien der KI-Vertrauenswürdigkeit (Datenqualität/Repräsentativität, CO2/Ressourcen, Genauigkeit, Robustheit, Fairness, Treue der Erklärungen, Sicherheit, IT-Sicherheit, Privatsphäre/Memorisierung, Löschung/Außerbetriebnahme) den Lebenszyklusphasen (Erzeugung/Entwicklung/Vertrieb/Nutzung/Außerbetriebnahme) zugeordnet, jeweils verknüpft mit der maßgeblichen SC-42-Norm (5259-2, TR 20226, TS 4213, 24029, TR 24027, TS 6254, TS 42119-7, 27090, 27091, 8183/5338) und dem Mess-Benchmark (MMLU, AdvGLUE, BBQ, HarmBench, MIA, TOFU, …). Das Schema ergänzt eine lifecycleStage pro Claim (mit einer neuen Phase „retirement“) sowie den Block quantitativeDeclaration nach Art einer EPD; das Type-III-Beispiel stellt diese Struktur dar, und der Katalog bietet einen Lebenszyklusfilter.", "fr": "Transposant le concept de catégorie d'impact de l'ACV environnementale, dix catégories d'impact sur le caractère digne de confiance de l'IA (qualité/représentativité des données, carbone/ressources, exactitude, robustesse, équité, fidélité des explications, sûreté, sécurité, vie privée/mémorisation, effacement/retrait) sont mises en correspondance avec les étapes du cycle de vie (génération/développement/distribution/utilisation/retrait), chacune étant rattachée à sa norme de référence du SC 42 (5259-2, TR 20226, TS 4213, 24029, TR 24027, TS 6254, TS 42119-7, 27090, 27091, 8183/5338) et à son benchmark de mesure (MMLU, AdvGLUE, BBQ, HarmBench, MIA, TOFU, …). Le schéma ajoute un lifecycleStage par claim (avec une nouvelle étape « retrait ») et le bloc quantitativeDeclaration à la manière d'une EPD ; l'exemple Type III restitue cette structure et le catalogue propose un filtre par cycle de vie.", "es": "Trasladando el concepto de categoría de impacto del ACV ambiental, diez categorías de impacto en la confiabilidad de la IA (calidad/representatividad de los datos, carbono/recursos, exactitud, robustez, equidad, fidelidad de la explicación, seguridad (safety), seguridad (security), privacidad/memorización, eliminación/retirada) se asignan a etapas del ciclo de vida (generación/desarrollo/distribución/uso/retirada), cada una vinculada a su norma de SC 42 de referencia (5259-2, TR 20226, TS 4213, 24029, TR 24027, TS 6254, TS 42119-7, 27090, 27091, 8183/5338) y a su benchmark de medición (MMLU, AdvGLUE, BBQ, HarmBench, MIA, TOFU, …). El esquema añade un lifecycleStage por claim (con una nueva etapa de 'retirada') y el bloque quantitativeDeclaration de estilo EPD; el ejemplo Type III renderiza esta estructura y el catálogo ofrece un filtro por ciclo de vida."}, "consider": {"ko": "폐기 단계의 측정(언러닝 효능·삭제 감사)은 벤치마크가 초기 단계라 지표 성숙도를 추적하며 갱신해야 한다. 생애주기 영향은 주체가 분산된다 — 학습 탄소는 개발사, 추론 탄소는 운영사에 귀속되므로 발급주체의 책임 경계를 명확히 하고 귀속 불가 항목은 naApplicability 사유로 처리한다. 모델·데이터가 갱신되면 생애주기 영향도 변하므로 만료일과 재측정 주기를 운영해 라벨의 시효를 관리한다. 영향 수치는 동일 선언단위(모델·설정·벤치 버전)에서만 비교 가능하며 이를 비교면책문으로 명시한다.", "en": "Retirement-stage measurement (unlearning efficacy, deletion audit) rests on early-stage benchmarks, so indicator maturity must be tracked and refreshed. Lifecycle impacts are split across parties — training carbon belongs to the developer, inference carbon to the operator — so the declarant's responsibility boundary is made explicit and non-attributable items are handled with naApplicability reasons. As models and data are updated, lifecycle impacts change, so expiry dates and re-measurement cycles manage label currency. Impact figures are comparable only under the same declared unit (model, configuration, benchmark version), stated in the comparability disclaimer.", "zh": "退役阶段测量(遗忘效力·删除审计)的基准尚处早期，须跟踪指标成熟度并更新。生命周期影响主体分散——训练碳归开发方、推理碳归运营方，故须明确发布主体的责任边界，不可归属项以 naApplicability 理由处理。模型·数据更新则生命周期影响随之变化，须运营到期日与再测量周期以管理标签时效。影响数值仅在相同声明单位(模型·配置·基准版本)下可比，并以可比性免责声明明示。", "de": "Messungen in der Phase der Außerbetriebnahme (Wirksamkeit des Unlearning, Löschaudit) beruhen auf noch frühen Benchmarks; daher muss die Reife der Indikatoren verfolgt und aktualisiert werden. Lebenszyklusauswirkungen verteilen sich auf mehrere Parteien – CO2 aus dem Training ist dem Entwickler, CO2 aus der Inferenz dem Betreiber zuzurechnen –, daher wird die Verantwortungsgrenze des Erklärenden ausdrücklich angegeben, und nicht zurechenbare Elemente werden mit naApplicability-Begründungen behandelt. Da Modelle und Daten aktualisiert werden, ändern sich Lebenszyklusauswirkungen; Ablaufdaten und Zyklen der Neumessung sichern daher die Aktualität des Labels. Wirkungswerte sind nur unter derselben deklarierten Einheit (Modell, Konfiguration, Benchmark-Version) vergleichbar, was im Vergleichbarkeitshinweis angegeben wird.", "fr": "La mesure à l'étape du retrait (efficacité du désapprentissage, audit de suppression) repose sur des benchmarks encore émergents ; la maturité des indicateurs doit donc être suivie et actualisée. Les impacts sur le cycle de vie se répartissent entre plusieurs parties — le carbone de l'entraînement relève du développeur, celui de l'inférence de l'exploitant — de sorte que la limite de responsabilité du déclarant est explicitée et que les éléments non imputables sont traités avec des motifs naApplicability. À mesure que les modèles et les données sont mis à jour, les impacts sur le cycle de vie évoluent ; les dates d'expiration et les cycles de nouvelle mesure assurent donc l'actualité de l'étiquette. Les chiffres d'impact ne sont comparables qu'à unité déclarée identique (modèle, configuration, version du benchmark), ce qui est indiqué dans l'avertissement sur la comparabilité.", "es": "La medición en la etapa de retirada (eficacia del desaprendizaje, auditoría de eliminación) se apoya en benchmarks incipientes, por lo que debe seguirse y actualizarse la madurez de los indicadores. Los impactos del ciclo de vida se reparten entre distintas partes —el carbono del entrenamiento corresponde al desarrollador, el de la inferencia al operador—, por lo que se explicita el límite de responsabilidad del declarante y los elementos no atribuibles se tratan con motivos naApplicability. A medida que se actualizan los modelos y los datos, cambian los impactos del ciclo de vida, por lo que las fechas de vencimiento y los ciclos de nueva medición gestionan la vigencia de la etiqueta. Las cifras de impacto solo son comparables bajo la misma unidad declarada (modelo, configuración, versión del benchmark), tal como se indica en el descargo de comparabilidad."}}, {"need": {"ko": "'안전한 AI'·'가장 신뢰할 수 있는' 같은 형용사·최상급은 측정·반증이 불가능하며, AI-washing(과장·기만적 신뢰 주장)을 조장한다.", "en": "Adjectives and superlatives like 'safe AI' or 'most trustworthy' cannot be measured or refuted and encourage AI-washing (exaggerated or deceptive trust claims).", "zh": "「安全的 AI」「最可信」等形容词·最高级无法测量与反驳，且助长 AI-washing(夸大·欺骗性的信任主张)。", "de": "Adjektive und Superlative wie „sichere KI“ oder „vertrauenswürdigste“ sind weder messbar noch widerlegbar und begünstigen AI-Washing (übertriebene oder irreführende Vertrauensaussagen).", "fr": "Les adjectifs et superlatifs tels que « IA sûre » ou « la plus digne de confiance » ne peuvent être ni mesurés ni réfutés et favorisent l'AI-washing (allégations de confiance exagérées ou trompeuses).", "es": "Adjetivos y superlativos como 'IA segura' o 'la más confiable' no pueden medirse ni refutarse y fomentan el AI-washing (afirmaciones de confianza exageradas o engañosas)."}, "guide": {"ko": "모든 주장은 검증가능해야 하며, 검증가능성 = 측정가능성 + 객관적 증거로 정의한다. 형용사·절대주장·단일 종합점수를 금지하고 동사·정량형만 허용한다. 각 항목에는 검증 수준(L1 자기선언·L2 입증공개·L3 제3자검증)을 배지로 정직하게 표시한다.", "en": "Every claim must be verifiable, where verifiability = measurability + objective evidence. Adjectives, absolute claims and any single composite score are prohibited; only verbs/quantities are allowed. Each item honestly shows its verification level (L1 self-declared, L2 evidence-disclosed, L3 third-party verified) as a badge.", "zh": "一切主张须可验证，可验证性 = 可测量性 + 客观证据。禁止形容词·绝对主张·单一综合评分，仅允许动词·定量表述。每项以徽章诚实标示验证等级(L1 自我声明·L2 证据公开·L3 第三方验证)。", "de": "Jeder Claim muss verifizierbar sein, wobei Verifizierbarkeit = Messbarkeit + objektiver Nachweis. Adjektive, absolute Aussagen und jeder zusammengesetzte Einzelwert sind unzulässig; nur Verben/Mengenangaben sind erlaubt. Jedes Element zeigt seine Verifizierungsstufe redlich als Plakette an (L1 selbst erklärt, L2 Nachweis offengelegt, L3 durch Dritte verifiziert).", "fr": "Chaque claim doit être vérifiable, la vérifiabilité désignant la mesurabilité + des preuves objectives. Les adjectifs, les allégations absolues et tout score composite unique sont interdits ; seuls les verbes et les quantités sont autorisés. Chaque élément affiche honnêtement son niveau de vérification (L1 autodéclaré, L2 preuves divulguées, L3 vérifié par une tierce partie) sous forme de badge.", "es": "Todo claim debe ser verificable, donde verificabilidad = medibilidad + evidencia objetiva. Se prohíben los adjetivos, las afirmaciones absolutas y cualquier puntuación compuesta única; solo se permiten verbos/cantidades. Cada elemento muestra con honestidad su nivel de verificación (L1 autodeclarado, L2 con evidencia divulgada, L3 verificado por terceros) como insignia."}, "impl": {"ko": "규칙(R1~R7: 동사·정량형만, 절대주장 금지, 입증자료, 검증등급, 모듈형 등)을 카탈로그 전 claim의 자격요건·표시단서에 내장했고, 스키마가 이를 기계적으로 강제한다 — status=declared면 verificationLevel·explanatoryStatement 필수, L2/L3면 evidenceUri 필수, L3면 thirdPartyVerifier(기관·인증번호·범위·유효기간) 필수, guardrailAttestation으로 규칙 준수를 자기확인한다. validate_label.py가 라벨 JSON을 자동 판정(스키마+baseline+규칙)하고 검증 엄밀성을 Assurance Grade A~E로 산출하며, 렌더러는 claim별 L1/L2/L3 배지·특성별 검증 서열·L1 디톤(회색 처리)으로 '무엇이 미검증인지'를 시각적으로 정직하게 드러낸다.", "en": "The rules (R1–R7: verbs/quantities only, no absolutes, evidence on hand, verification tiers, modularity) are embedded in every claim's qualification and required statement, and the schema enforces them mechanically — status=declared requires verificationLevel and explanatoryStatement; L2/L3 requires evidenceUri; L3 requires thirdPartyVerifier (body, certificate no., scope, validity); guardrailAttestation self-attests rule compliance. validate_label.py auto-judges a label JSON (schema+baseline+rules) and computes an Assurance Grade A–E for verification rigor, while the renderer shows per-claim L1/L2/L3 badges, per-characteristic verification strength and a de-toned (grey) treatment for L1 — making what is unverified visually honest.", "zh": "将 R1~R7 规则(仅动词·定量、禁绝对主张、备有证据、验证等级、模块化等)内嵌于目录全部 claim 的资格要件·表示限定语，并由架构机械强制——status=declared 须有 verificationLevel·explanatoryStatement；L2/L3 须有 evidenceUri；L3 须有 thirdPartyVerifier(机构·证书号·范围·有效期)；以 guardrailAttestation 自证合规。validate_label.py 自动判定标签 JSON(架构+baseline+规则)并计算保障等级 Assurance Grade A~E；渲染器以每 claim 的 L1/L2/L3 徽章·特性级验证强度·L1 降色(灰化)在视觉上诚实呈现「何者未经验证」。", "de": "Die Regeln (R1–R7: nur Verben/Mengenangaben, keine absoluten Aussagen, vorliegende Nachweise, Verifizierungsstufen, Modularität) sind in der Einschränkung und der erforderlichen Angabe jedes Claims verankert, und das Schema setzt sie maschinell durch – status=declared erfordert verificationLevel und explanatoryStatement; L2/L3 erfordert evidenceUri; L3 erfordert thirdPartyVerifier (Stelle, Zertifikatsnr., Geltungsbereich, Gültigkeit); guardrailAttestation bestätigt die Einhaltung der Regeln selbst. validate_label.py beurteilt ein Label-JSON automatisch (Schema+Basisanforderungen+Regeln) und berechnet einen Assurance Grade A–E für die Verifizierungsstrenge, während der Renderer L1/L2/L3-Plaketten pro Claim, die Verifizierungsstärke je Merkmal und eine zurückgenommene (graue) Darstellung für L1 zeigt – wodurch Unverifiziertes visuell redlich erkennbar wird.", "fr": "Les règles (R1–R7 : verbes/quantités uniquement, aucune allégation absolue, preuves disponibles, niveaux de vérification, modularité) sont intégrées dans la qualification et la mention requise de chaque claim, et le schéma les applique mécaniquement — status=declared exige verificationLevel et explanatoryStatement ; L2/L3 exige evidenceUri ; L3 exige thirdPartyVerifier (organisme, n° de certificat, périmètre, validité) ; guardrailAttestation atteste soi-même le respect des règles. validate_label.py évalue automatiquement un JSON d'étiquette (schéma+socle+règles) et calcule un niveau d'assurance A–E reflétant la rigueur de la vérification, tandis que le moteur de rendu affiche les badges L1/L2/L3 par claim, la force de vérification par caractéristique et un traitement atténué (gris) pour L1 — rendant visuellement honnête ce qui n'est pas vérifié.", "es": "Las reglas (R1–R7: solo verbos/cantidades, sin absolutos, evidencia disponible, niveles de verificación, modularidad) están integradas en la calificación y la declaración obligatoria de cada claim, y el esquema las aplica de forma mecánica: status=declared exige verificationLevel y explanatoryStatement; L2/L3 exige evidenceUri; L3 exige thirdPartyVerifier (organismo, n.º de certificado, alcance, vigencia); guardrailAttestation autoacredita el cumplimiento de las reglas. validate_label.py evalúa automáticamente un JSON de etiqueta (esquema+base mínima+reglas) y calcula un grado de aseguramiento A–E del rigor de la verificación, mientras que el renderizador muestra insignias L1/L2/L3 por claim, la solidez de la verificación por característica y un tratamiento atenuado (gris) para L1, haciendo visualmente honesto lo que no está verificado."}, "consider": {"ko": "L1 자기선언은 어디까지나 미검증이므로 배지·디톤으로 정직하게 표시하되 사용자가 배지 자체를 품질 보증으로 오독하지 않게 문구를 관리한다. 정량 지표는 측정셋 의존성이 커서 C1~C7 표시단서(벤치ID·지표정의·프로토콜·도메인·오염점검·측정일·측정주체) 없이는 비교가 성립하지 않는다. '단일 종합점수 금지'가 비교를 어렵게 한다는 반론에는 품질점수가 아닌 검증 엄밀성 등급(Assurance Grade)으로 응답하되, 등급이 품질로 오독되지 않도록 '검증 깊이'임을 병기한다. 증거 링크는 시간이 지나면 부패(link rot)하므로 해시·아카이브 사본·유효기간 관리가 필요하다.", "en": "L1 self-declaration remains unverified, so it is honestly badged and de-toned while wording is managed so users do not misread the badge itself as a quality guarantee. Quantitative metrics are measurement-set-dependent — without the C1–C7 qualifiers (benchmark ID, metric definition, protocol, domain, contamination check, date, measuring party) comparison is invalid. The objection that 'no single score' hampers comparison is answered with the Assurance Grade — a verification-rigor grade, not a quality score, and labeled as such to prevent misreading. Evidence links rot over time, so hashes, archived copies and validity management are required.", "zh": "L1 自我声明终究未经验证，故以徽章·降色诚实标示，同时管理措辞以免用户将徽章本身误读为质量保证。定量指标高度依赖测试集——无 C1~C7 限定语(基准 ID·指标定义·协议·领域·污染检查·测量日·测量主体)则比较不成立。对「禁单一综合评分有碍比较」的反论，以保障等级(Assurance Grade)回应——它是验证严格度等级而非质量分，并注明以防误读。证据链接会随时间腐坏(link rot)，须以哈希·存档副本·有效期管理。", "de": "Eine L1-Selbsterklärung bleibt unverifiziert; sie wird daher redlich mit einer Plakette versehen und optisch zurückgenommen, wobei die Formulierung so gesteuert wird, dass Nutzer die Plakette selbst nicht als Qualitätsgarantie missverstehen. Quantitative Metriken hängen vom Messset ab – ohne die Qualifikatoren C1–C7 (Benchmark-ID, Metrikdefinition, Protokoll, Domäne, Kontaminationsprüfung, Datum, messende Stelle) ist ein Vergleich unzulässig. Dem Einwand, dass „kein Einzelwert“ den Vergleich erschwert, wird mit dem Assurance Grade begegnet – einer Einstufung der Verifizierungsstrenge, keinem Qualitätswert, und als solche gekennzeichnet, um Fehlinterpretationen vorzubeugen. Nachweislinks veralten mit der Zeit; daher sind Hashes, archivierte Kopien und eine Gültigkeitsverwaltung erforderlich.", "fr": "L'autodéclaration L1 reste non vérifiée ; elle est donc signalée honnêtement par un badge atténué, et la formulation est maîtrisée afin que les utilisateurs ne prennent pas le badge lui-même pour une garantie de qualité. Les métriques quantitatives dépendent du jeu de mesure — sans les qualificatifs C1–C7 (identifiant du benchmark, définition de la métrique, protocole, domaine, contrôle de contamination, date, partie ayant effectué la mesure), toute comparaison est invalide. À l'objection selon laquelle l'absence de « score unique » entrave la comparaison, on répond par le niveau d'assurance — un niveau de rigueur de la vérification, et non un score de qualité, présenté comme tel pour éviter toute mauvaise interprétation. Les liens vers les preuves se dégradent avec le temps ; des hachages, des copies archivées et une gestion de la validité sont donc exigés.", "es": "La autodeclaración L1 sigue sin verificarse, por lo que se señala con honestidad mediante una insignia y un tono atenuado, a la vez que se cuida la redacción para que los usuarios no interpreten erróneamente la propia insignia como una garantía de calidad. Las métricas cuantitativas dependen del conjunto de medición: sin los calificadores C1–C7 (ID del benchmark, definición de la métrica, protocolo, dominio, comprobación de contaminación, fecha, parte que mide) la comparación no es válida. La objeción de que 'ninguna puntuación única' dificulta la comparación se responde con el grado de aseguramiento: un grado de rigor de la verificación, no una puntuación de calidad, y etiquetado como tal para evitar malinterpretaciones. Los enlaces de evidencia se degradan con el tiempo, por lo que se requieren hashes, copias archivadas y gestión de la vigencia."}}, {"need": {"ko": "라벨은 사람의 구매·감독 판단과 시스템의 자동 처리(조달 자동대조, 상류→하류 재선언)를 모두 뒷받침해야 한다. 사람용·기계용이 분리되면 정보가 어긋난다.", "en": "The label must support both human buy/oversight judgment and system automation (automated procurement matching, upstream→downstream re-declaration); separating human- and machine-facing forms lets information drift apart.", "zh": "标签须同时支撑人的购买·监督判断与系统自动化(采购自动比对·上游→下游再声明)；人用与机用分离会使信息彼此偏离。", "de": "Das Label muss sowohl menschliche Kauf-/Aufsichtsentscheidungen als auch Systemautomatisierung unterstützen (automatisierter Beschaffungsabgleich, Neudeklaration vorgelagert→nachgelagert); die Trennung von menschen- und maschinenorientierten Formen lässt Informationen auseinanderlaufen.", "fr": "L'étiquette doit servir à la fois le jugement humain d'achat/de supervision et l'automatisation des systèmes (rapprochement automatisé des achats, redéclaration amont→aval) ; séparer les formes destinées aux humains et aux machines conduit à une divergence des informations.", "es": "La etiqueta debe respaldar tanto el juicio humano de compra/supervisión como la automatización de sistemas (correspondencia automatizada en la contratación, nueva declaración de aguas arriba→aguas abajo); separar las formas orientadas a personas y a máquinas hace que la información diverja."}, "guide": {"ko": "동일한 선언을 사람이 읽는 사실 라벨과 기계가 읽는 구조화 데이터로 함께 제공한다. 라벨은 식별 가능한 발급주체·버전·유효기간을 갖고 상호운용 가능한 형식이어야 한다.", "en": "The same declaration is provided both as a human-readable fact label and as machine-readable structured data. The label carries an identifiable declarant, version and validity, in an interoperable format.", "zh": "同一声明以人读事实标签与机读结构化数据一并提供。标签须具有可识别的发布主体·版本·有效期，并采用可互操作的格式。", "de": "Dieselbe Erklärung wird sowohl als für Menschen lesbares Faktenlabel als auch als maschinenlesbare strukturierte Daten bereitgestellt. Das Label enthält einen identifizierbaren Erklärenden, eine Version und eine Gültigkeit in einem interoperablen Format.", "fr": "La même déclaration est fournie à la fois sous forme d'étiquette factuelle lisible par l'humain et de données structurées lisibles par machine. L'étiquette comporte un déclarant identifiable, une version et une validité, dans un format interopérable.", "es": "La misma declaración se proporciona tanto como etiqueta de datos legible por personas como en forma de datos estructurados legibles por máquina. La etiqueta incluye un declarante identificable, una versión y una vigencia, en un formato interoperable."}, "impl": {"ko": "단일 소스 원칙으로 구현했다 — claims.csv와 라벨 인스턴스(JSON)가 원본이고, 사람용 사실 라벨(렌더러: B2C 요약/B2B 전체·FOP Grade·must-know)과 기계용 데이터(profile-schema.json으로 검증되는 JSON)가 같은 원본에서 생성되므로 표현이 어긋날 수 없다. 스키마에는 발급주체(legalName·role·contact)·버전·선언일·만료일이 필수이고, JSON Schema(additionalProperties:false)로 임의 필드 삽입을 차단한다. 기계가독성의 효용은 두 도구로 구체화했다 — compliance_crosswalk.py는 라벨 JSON에서 EU AI Act 등 규제별 공시 초안을 자동 생성하고, OEM pass-through는 상류 라벨의 claim을 하류 제품 라벨로 재선언하는 공급망 전이를 지원한다. 사람용 표시는 한/영/중/독/불/서 6개 언어를 제공한다.", "en": "Implemented on a single-source principle — claims.csv and the label instance (JSON) are the originals, and both the human-facing fact label (renderer: B2C condensed / B2B full, FOP Grade, must-know) and the machine-facing data (JSON validated by profile-schema.json) are generated from the same source, so they cannot drift apart. The schema requires declarant (legalName, role, contact), version, declaration and expiry dates, and blocks arbitrary fields (additionalProperties:false). The value of machine readability is concretized in two tools: compliance_crosswalk.py auto-drafts per-regulation disclosures (EU AI Act etc.) from the label JSON, and OEM pass-through re-declares upstream claims into downstream product labels across the supply chain. The human-facing display ships in six languages (ko/en/zh/de/fr/es).", "zh": "以单一来源原则实现——claims.csv 与标签实例(JSON)为原本，人读事实标签(渲染器：B2C 精简/B2B 完整·FOP 等级·must-know)与机读数据(经 profile-schema.json 验证的 JSON)由同一原本生成，故不会彼此偏离。架构必填发布主体(legalName·role·contact)·版本·声明日·到期日，并以 JSON Schema(additionalProperties:false)阻断任意字段。机器可读性的效用以两个工具具体化——compliance_crosswalk.py 从标签 JSON 自动生成各法规(EU AI Act 等)披露草案；OEM pass-through 支持将上游 claim 再声明于下游产品标签的供应链传递。人读展示提供韩/英/中/德/法/西六种语言。", "de": "Umgesetzt nach dem Single-Source-Prinzip – claims.csv und die Label-Instanz (JSON) sind die Originale, und sowohl das für Menschen bestimmte Faktenlabel (Renderer: B2C verkürzt / B2B vollständig, FOP Grade, Pflichtangaben) als auch die für Maschinen bestimmten Daten (JSON, validiert durch profile-schema.json) werden aus derselben Quelle erzeugt, sodass sie nicht auseinanderlaufen können. Das Schema verlangt Erklärenden (legalName, role, contact), Version, Erklärungs- und Ablaufdatum und sperrt beliebige Felder (additionalProperties:false). Der Wert der Maschinenlesbarkeit wird in zwei Werkzeugen konkretisiert: compliance_crosswalk.py erstellt aus dem Label-JSON automatisch Entwürfe für vorschriftsspezifische Offenlegungen (EU AI Act usw.), und das OEM-Pass-through deklariert vorgelagerte Claims entlang der Lieferkette in nachgelagerte Produktlabels neu. Die für Menschen bestimmte Darstellung ist in sechs Sprachen verfügbar (ko/en/zh/de/fr/es).", "fr": "Mis en œuvre selon un principe de source unique — claims.csv et l'instance d'étiquette (JSON) sont les originaux, et l'étiquette factuelle destinée aux humains (moteur de rendu : B2C condensé / B2B complet, niveau d'assurance en face avant (FOP), essentiels) comme les données destinées aux machines (JSON validé par profile-schema.json) sont générées à partir de la même source, de sorte qu'elles ne peuvent pas diverger. Le schéma exige le déclarant (legalName, role, contact), la version, les dates de déclaration et d'expiration, et bloque les champs arbitraires (additionalProperties:false). La valeur de la lisibilité par machine se concrétise dans deux outils : compliance_crosswalk.py prépare automatiquement, à partir du JSON de l'étiquette, les divulgations propres à chaque réglementation (AI Act de l'UE, etc.), et le relais OEM redéclare les claims amont dans les étiquettes des produits aval tout au long de la chaîne d'approvisionnement. L'affichage destiné aux humains est disponible en six langues (ko/en/zh/de/fr/es).", "es": "Se implementa según un principio de fuente única: claims.csv y la instancia de etiqueta (JSON) son los originales, y tanto la etiqueta de datos orientada a personas (renderizador: B2C condensada / B2B completa, FOP Grade, imprescindibles) como los datos orientados a máquinas (JSON validado por profile-schema.json) se generan a partir de la misma fuente, por lo que no pueden divergir. El esquema exige declarante (legalName, role, contact), versión, fechas de declaración y de vencimiento, y bloquea campos arbitrarios (additionalProperties:false). El valor de la legibilidad por máquina se concreta en dos herramientas: compliance_crosswalk.py redacta automáticamente borradores de las divulgaciones por normativa (Reglamento de IA de la UE, etc.) a partir del JSON de la etiqueta, y el traspaso OEM (pass-through) vuelve a declarar los claims de origen en las etiquetas de los productos aguas abajo a lo largo de la cadena de suministro. La visualización orientada a personas se ofrece en seis idiomas (ko/en/zh/de/fr/es)."}, "consider": {"ko": "기계가독 데이터는 위·변조와 허위 재선언 위험이 있으므로 변조내성 용어만 쓰고, 발급주체 검증·전자서명·해시 체인 같은 무결성 장치를 도입 단계에 맞춰 강화해야 한다. 스키마는 규제·표준 개정에 따라 진화하므로 labelVersion으로 버전을 관리하고 하위 호환을 유지한다. pass-through 시 하류가 상류 선언을 잘못 인용하거나 유효기간이 지난 선언을 재사용하는 문제를 막기 위해 원 선언 참조·만료 검사·범위 한정이 필요하다. QR·URL 등 물리적 접점 표기와 접근성(스크린리더·다국어)도 유통 설계에서 다뤄야 한다.", "en": "Machine-readable data risks tampering and false re-declaration, so only tamper-evident wording is used, and integrity mechanisms — declarant verification, digital signatures, hash chains — should be phased in as adoption grows. The schema evolves with regulation and standards, so labelVersion manages versions with backward compatibility. In pass-through, downstream misquoting or reuse of expired upstream declarations is prevented by source references, expiry checks and scope limits. Physical touchpoints (QR/URL) and accessibility (screen readers, multilingual) also belong to the distribution design.", "zh": "机读数据有篡改与虚假再声明风险，故仅用防篡改措辞，并随采用扩大分阶段引入发布主体验证·电子签名·哈希链等完整性机制。架构随法规·标准修订演进，以 labelVersion 管理版本并保持向后兼容。pass-through 中为防下游误引上游声明或复用过期声明，须有源声明引用·到期检查·范围限定。QR·URL 等物理接触点标示与无障碍(读屏·多语言)亦属发行设计范畴。", "de": "Maschinenlesbare Daten bergen das Risiko von Manipulation und falscher Neudeklaration; daher werden ausschließlich manipulationsfeste Formulierungen verwendet, und Integritätsmechanismen – Verifizierung des Erklärenden, digitale Signaturen, Hash-Ketten – sollten mit zunehmender Verbreitung schrittweise eingeführt werden. Das Schema entwickelt sich mit Regulierung und Normung weiter; daher verwaltet labelVersion die Versionen mit Abwärtskompatibilität. Beim Pass-through werden fehlerhafte Zitate in nachgelagerten Stufen oder die Wiederverwendung abgelaufener vorgelagerter Erklärungen durch Quellenverweise, Ablaufprüfungen und Begrenzungen des Geltungsbereichs verhindert. Physische Kontaktpunkte (QR/URL) und Barrierefreiheit (Screenreader, Mehrsprachigkeit) gehören ebenfalls zum Verbreitungskonzept.", "fr": "Les données lisibles par machine sont exposées aux risques d'altération et de fausse redéclaration ; seule une formulation vérifiable est donc utilisée, et des mécanismes d'intégrité — vérification du déclarant, signatures numériques, chaînes de hachage — devraient être introduits progressivement à mesure que l'adoption progresse. Le schéma évolue avec la réglementation et les normes ; labelVersion gère donc les versions avec rétrocompatibilité. Dans le relais, les citations erronées en aval ou la réutilisation de déclarations amont expirées sont évitées par des références aux sources, des contrôles d'expiration et des limites de périmètre. Les points de contact physiques (QR/URL) et l'accessibilité (lecteurs d'écran, multilinguisme) relèvent également de la conception de la diffusion.", "es": "Los datos legibles por máquina corren el riesgo de manipulación y de nueva declaración falsa, por lo que solo se utiliza redacción a prueba de manipulaciones, y los mecanismos de integridad —verificación del declarante, firmas digitales, cadenas de hashes— deben introducirse progresivamente a medida que crezca la adopción. El esquema evoluciona con la regulación y las normas, por lo que labelVersion gestiona las versiones con compatibilidad hacia atrás. En el traspaso (pass-through), la cita errónea aguas abajo o la reutilización de declaraciones de origen vencidas se evitan mediante referencias a la fuente, comprobaciones de vencimiento y límites de alcance. Los puntos de contacto físicos (QR/URL) y la accesibilidad (lectores de pantalla, multilingüismo) también forman parte del diseño de la distribución."}}, {"need": {"ko": "기반모델·챗봇·콘텐츠생성·의사결정지원·임베디드·에이전트·추천·생체인식 등 제품 유형마다 중요한 신뢰성 특성이 다르다. 모든 특성을 일률 요구하면 부적합하거나 형식적인 선언이 된다.", "en": "Product types — foundation models, chatbots, content generation, decision support, embedded, agentic, recommender, biometric — prioritize different trustworthiness characteristics; requiring all uniformly yields mismatched or perfunctory declarations.", "zh": "基础模型·聊天机器人·内容生成·决策支持·嵌入式·智能体·推荐·生物识别等产品类型所重视的可信性特性不同；一刀切要求会导致不匹配或形式化的声明。", "de": "Produkttypen – Foundation Models, Chatbots, Inhaltsgenerierung, Entscheidungsunterstützung, eingebettete KI, agentenbasierte KI, Empfehlungssysteme, Biometrie – priorisieren unterschiedliche Merkmale der Vertrauenswürdigkeit; eine einheitliche Pflicht zu allen führt zu unpassenden oder pro forma abgegebenen Deklarationen.", "fr": "Les types de produits — modèles de fondation, chatbots, génération de contenu, aide à la décision, embarqué, agentique, recommandation, biométrie — privilégient des caractéristiques du caractère digne de confiance différentes ; les exiger toutes uniformément conduit à des déclarations inadaptées ou de pure forme.", "es": "Los tipos de producto —modelos fundacionales, chatbots, generación de contenido, apoyo a la decisión, embebidos, agénticos, recomendación, biometría— priorizan características de confiabilidad distintas; exigirlas todas de manera uniforme da lugar a declaraciones inadecuadas o meramente formales."}, "guide": {"ko": "제품 유형별로 적용되는 특성만 모듈형으로 선언하게 하고, 유형별 필수(●)/권장(○)/선택(▷)/해당없음(—)을 구분한다. 유형별로 구매 결정에 가장 결정적인 'must-know' 항목을 전면에 노출한다.", "en": "Only the characteristics applicable to a product type are declared, modularly, distinguishing MUST (●) / SHOULD (○) / MAY (▷) / N/A (—) per type; the items most decisive for that type's purchase decision are surfaced front-of-pack as 'must-know'.", "zh": "仅以模块化方式声明适用于该产品类型的特性，按类型区分必需(●)/建议(○)/可选(▷)/不适用(—)；将对该类型购买决策最关键的「must-know」项前置展示。", "de": "Nur die für einen Produkttyp anwendbaren Merkmale werden modular deklariert, wobei je Typ zwischen MUSS (●) / SOLL (○) / KANN (▷) / N. Z. (—) unterschieden wird; die für die Kaufentscheidung dieses Typs ausschlaggebendsten Elemente werden auf der Vorderseite (Front-of-Pack) als „Pflichtangaben“ hervorgehoben.", "fr": "Seules les caractéristiques applicables à un type de produit sont déclarées, de manière modulaire, en distinguant MUST (●) / SHOULD (○) / MAY (▷) / S.O. (—) par type ; les éléments les plus déterminants pour la décision d'achat propre à ce type sont mis en avant en face avant en tant qu'« essentiels ».", "es": "Solo se declaran, de forma modular, las características aplicables a un tipo de producto, distinguiendo MUST (●) / SHOULD (○) / MAY (▷) / N/A (—) por tipo; los elementos más decisivos para la decisión de compra de ese tipo se muestran en la parte frontal (front-of-pack) como 'imprescindibles'."}, "impl": {"ko": "8개 제품 유형(기반모델·대화형비서·콘텐츠생성·의사결정지원·임베디드·에이전트·추천랭킹·생체인식)마다 ① 17개 특성 프로파일 매트릭스와 신규 15 claim 매트릭스(●○▷—)로 적용 수준을 정의하고, ② 유형별 must-know 5를 큐레이션해 전면 신호로 고정했으며, ③ 유형별 예제 라벨 8종을 렌더러에 구현했다. 적합성 판정은 유형의 MUST 전부 선언 + 비적용 특성의 naApplicability 사유 명시를 요구하고(Conformant/Non-Conformant), 글로벌 baseline(AI 고지·책임주체·합성표시)은 유형과 무관하게 무조건 필수로 둔다. 추천·생체인식처럼 규제 현저성이 높은 유형은 EU DSA·AI Act Annex III 근거를 프로파일에 반영했다.", "en": "For each of eight product types (foundation model, chatbot, content generation, decision support, embedded, agentic, recommender/ranking, biometric/perception): (1) a 17-characteristic profile matrix plus a 15-new-claim matrix (●○▷—) defines applicability; (2) a curated per-type must-know 5 is fixed as the front-of-pack signal; (3) eight per-type example labels are implemented in the renderer. Conformance requires declaring all of the type's MUSTs plus naApplicability reasons for non-applicable characteristics (Conformant/Non-Conformant), while the global baseline (AI disclosure, accountable party, synthetic marking) stays unconditionally required regardless of type. Types with high regulatory salience (recommender, biometric) embed EU DSA / AI Act Annex III grounds in their profiles.", "zh": "为 8 种产品类型(基础模型·对话助手·内容生成·决策支持·嵌入式·智能体·推荐排序·生物识别)各定义：①17 特性配置矩阵+新增 15 claim 矩阵(●○▷—)界定适用度；②策划各类型 must-know 5 并固定为前置信号；③在渲染器实现 8 种类型示例标签。符合性判定要求声明该类型全部 MUST+对不适用特性注明 naApplicability 理由(Conformant/Non-Conformant)；全局 baseline(AI 告知·责任主体·合成标示)与类型无关一律必需。监管显著性高的类型(推荐·生物识别)在配置中嵌入 EU DSA·AI Act Annex III 依据。", "de": "Für jeden der acht Produkttypen (Foundation Model, Chatbot, Inhaltsgenerierung, Entscheidungsunterstützung, eingebettet, agentenbasiert, Empfehlung/Ranking, Biometrie/Wahrnehmung): (1) eine Profilmatrix mit 17 Merkmalen sowie eine Matrix mit 15 neuen Claims (●○▷—) legt die Anwendbarkeit fest; (2) eine kuratierte, typspezifische Auswahl von 5 Pflichtangaben ist als Front-of-Pack-Signal festgelegt; (3) acht typspezifische Beispiellabels sind im Renderer umgesetzt. Konformität erfordert die Deklaration aller MUSS-Elemente des Typs sowie naApplicability-Begründungen für nicht anwendbare Merkmale (Konform/Nicht konform), während die globalen Basisanforderungen (KI-Offenlegung, verantwortliche Stelle, Kennzeichnung synthetischer Inhalte) unabhängig vom Typ uneingeschränkt verpflichtend bleiben. Typen mit hoher regulatorischer Relevanz (Empfehlung, Biometrie) verankern Grundlagen aus EU DSA / AI Act Anhang III in ihren Profilen.", "fr": "Pour chacun des huit types de produits (modèle de fondation, chatbot, génération de contenu, aide à la décision, embarqué, agentique, recommandation/classement, biométrie/perception) : (1) une matrice de profil de 17 caractéristiques et une matrice de 15 nouveaux claims (●○▷—) définissent l'applicabilité ; (2) 5 essentiels sélectionnés par type sont fixés comme signal de face avant ; (3) huit exemples d'étiquettes par type sont mis en œuvre dans le moteur de rendu. La conformité exige de déclarer toutes les exigences MUST du type ainsi que les motifs naApplicability pour les caractéristiques non applicables (Conforme/Non conforme), tandis que le socle global (divulgation de l'IA, partie responsable, marquage du contenu synthétique) reste exigé sans condition, quel que soit le type. Les types à forte sensibilité réglementaire (recommandation, biométrie) intègrent dans leurs profils les fondements du DSA de l'UE / de l'annexe III de l'AI Act.", "es": "Para cada uno de los ocho tipos de producto (modelo fundacional, chatbot, generación de contenido, apoyo a la decisión, embebido, agéntico, recomendación/clasificación, biometría/percepción): (1) una matriz de perfil de 17 características más una matriz de 15 nuevos claims (●○▷—) define la aplicabilidad; (2) se fijan 5 imprescindibles curados por tipo como señal frontal (front-of-pack); (3) se implementan en el renderizador ocho etiquetas de ejemplo por tipo. La conformidad exige declarar todos los MUST del tipo más los motivos naApplicability de las características no aplicables (Conforme/No conforme), mientras que la base mínima global (divulgación de IA, parte responsable, marcado de contenido sintético) sigue siendo obligatoria incondicionalmente con independencia del tipo. Los tipos con alta relevancia regulatoria (recomendación, biometría) incorporan en sus perfiles los fundamentos de la DSA de la UE / Anexo III del Reglamento de IA."}, "consider": {"ko": "제품 유형 분류는 시장 변화(멀티모달·에이전트 확산 등)에 따라 주기적으로 갱신해야 하며, 신규 유형 추가 시 프로파일 매트릭스·must-know·예제·스키마 enum을 함께 확장하는 절차를 따른다. 의료·자율주행·교육 같은 도메인은 기능형 유형 위에 얹는 '섹터 오버레이'로 다뤄 유형×도메인 조합 폭발을 피한다. 경계가 모호한 제품(예: 검색+생성 하이브리드)은 복수 프로파일 적용을 허용하고, 유형 프로파일 준수가 형식적 box-ticking이 되지 않도록 must-know는 개수가 아니라 그 유형의 실질 위험(생체=인구집단 정확도, 추천=노출 편향)을 겨냥해 선정한다.", "en": "The taxonomy must be refreshed as the market shifts (multimodal, agentic), and adding a type follows a procedure that extends the profile matrix, must-know, examples and schema enum together. Domains such as medical, autonomous driving and education are handled as a 'sector overlay' on top of functional types to avoid type×domain combinatorial explosion. Boundary-blurring products (e.g., search+generation hybrids) may apply multiple profiles, and to keep profile conformance from becoming box-ticking, must-know items target the type's substantive risks (biometric = demographic accuracy, recommender = exposure bias) rather than a count.", "zh": "产品类型分类须随市场变化(多模态·智能体扩散等)定期更新；新增类型时遵循同步扩展配置矩阵·must-know·示例·架构枚举的流程。医疗·自动驾驶·教育等领域以叠加于功能型之上的「行业叠加(sector overlay)」处理，避免类型×领域组合爆炸。边界模糊的产品(如检索+生成混合)允许应用多个配置；为防配置符合流于形式化打勾(box-ticking)，must-know 不以数量而以该类型的实质风险(生物识别=人群准确性、推荐=曝光偏差)为准选定。", "de": "Die Taxonomie muss mit dem Wandel des Marktes (multimodal, agentenbasiert) aktualisiert werden, und die Aufnahme eines Typs folgt einem Verfahren, das Profilmatrix, Pflichtangaben, Beispiele und Schema-Enum gemeinsam erweitert. Domänen wie Medizin, autonomes Fahren und Bildung werden als „Sektor-Overlay“ auf funktionalen Typen behandelt, um eine kombinatorische Explosion Typ×Domäne zu vermeiden. Produkte mit unscharfen Grenzen (z. B. Hybride aus Suche+Generierung) können mehrere Profile anwenden, und damit Profilkonformität nicht zum bloßen Abhaken wird, zielen Pflichtangaben auf die wesentlichen Risiken des Typs (Biometrie = demografische Genauigkeit, Empfehlung = Expositions-Bias) statt auf eine Anzahl.", "fr": "La taxonomie doit être actualisée à mesure que le marché évolue (multimodal, agentique), et l'ajout d'un type suit une procédure qui étend conjointement la matrice de profils, les essentiels, les exemples et l'énumération du schéma. Les domaines tels que le médical, la conduite autonome et l'éducation sont traités comme une « surcouche sectorielle » au-dessus des types fonctionnels afin d'éviter l'explosion combinatoire type×domaine. Les produits aux frontières floues (par ex. hybrides recherche+génération) peuvent appliquer plusieurs profils et, pour que la conformité aux profils ne devienne pas un simple exercice de cases à cocher, les essentiels ciblent les risques substantiels du type (biométrie = exactitude démographique, recommandation = biais d'exposition) plutôt qu'un nombre.", "es": "La taxonomía debe actualizarse a medida que evoluciona el mercado (multimodal, agéntico), y la incorporación de un tipo sigue un procedimiento que amplía conjuntamente la matriz de perfiles, los imprescindibles, los ejemplos y el enum del esquema. Dominios como la medicina, la conducción autónoma y la educación se tratan como una 'superposición sectorial' sobre los tipos funcionales para evitar la explosión combinatoria tipo×dominio. Los productos de límites difusos (p. ej., híbridos de búsqueda+generación) pueden aplicar varios perfiles y, para evitar que la conformidad con el perfil se convierta en un mero trámite, los elementos imprescindibles se centran en los riesgos sustantivos del tipo (biometría = exactitud demográfica, recomendación = sesgo de exposición) y no en un recuento."}}], "rules": [{"ko": "동사·정량형만, 형용사·절대형 금지", "en": "Verbs & quantities only; no adjectives/absolutes", "zh": "仅用动词·定量表述,禁用形容词·绝对表述", "de": "Nur Verben & Mengenangaben; keine Adjektive/absoluten Aussagen", "fr": "Verbes et quantités uniquement ; ni adjectifs ni allégations absolues", "es": "Solo verbos y cantidades; sin adjetivos/absolutos"}, {"ko": "검증성 = 측정가능성 + 객관적 증거", "en": "Verifiability = measurability + objective evidence", "zh": "可验证性 = 可测量性 + 客观证据", "de": "Verifizierbarkeit = Messbarkeit + objektiver Nachweis", "fr": "Vérifiabilité = mesurabilité + preuves objectives", "es": "Verificabilidad = medibilidad + evidencia objetiva"}, {"ko": "claim별 검증등급 배지(L1/L2/L3)", "en": "Per-claim verification badge (L1/L2/L3)", "zh": "各 claim 配验证等级徽章(L1/L2/L3)", "de": "Verifizierungsplakette pro Claim (L1/L2/L3)", "fr": "Badge de vérification par claim (L1/L2/L3)", "es": "Insignia de verificación por claim (L1/L2/L3)"}, {"ko": "안전·견고성은 L3 제3자검증 전용", "en": "Safety/robustness are L3 third-party only", "zh": "安全·鲁棒性仅限 L3 第三方验证", "de": "Sicherheit/Robustheit nur L3 durch Dritte", "fr": "La sûreté et la robustesse relèvent exclusivement de L3 (tierce partie)", "es": "Seguridad (safety)/robustez solo L3 por terceros"}, {"ko": "모듈형 프로파일(제품유형별 적용)", "en": "Modular profile (applies per product type)", "zh": "模块化画像(按产品类型适用)", "de": "Modulares Profil (gilt je Produkttyp)", "fr": "Profil modulaire (s'applique par type de produit)", "es": "Perfil modular (se aplica por tipo de producto)"}], "utility": [{"actor": "U", "ko_t": "사용자", "ko": "“내 데이터를 학습에 쓰나? AI인가?”를 구매 전 확인", "en_t": "User", "en": "Check “Is my data used for training? Is this an AI?” before buying", "zh_t": "用户", "zh": "购买前确认“我的数据会用于训练吗?这是 AI 吗?”", "de_t": "Nutzer", "de": "Vor dem Kauf prüfen: „Werden meine Daten für das Training verwendet? Ist das eine KI?“", "fr_t": "Utilisateur", "fr": "Vérifier « Mes données servent-elles à l'entraînement ? Est-ce une IA ? » avant d'acheter", "es_t": "Usuario", "es": "Comprobar «¿Se usan mis datos para entrenar? ¿Es esto una IA?» antes de comprar"}, {"actor": "M", "ko_t": "제조사/OEM", "ko": "상류 AI 부품을 납품 요건으로 검증, 자사 라벨로 재선언", "en_t": "Manufacturer / OEM", "en": "Verify upstream AI parts as a supply gate; re-declare in own label", "zh_t": "制造商/OEM", "zh": "将上游 AI 部件作为供货要件加以验证,并以自家标签重新声明", "de_t": "Hersteller /
