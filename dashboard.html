function badge(level){
 // level may be "L1", "L1/L2", "L3" etc -> show highest tier badge + raw
 const tier=level.includes('L3')?3:level.includes('L2')?2:1;
 return `<span class="badge b${tier}">${level} · ${T('L'+tier)}</span>`;

function levelMatch(claim){
 if(F.levels.size===0)return true;
 for(const l of F.levels){if(claim.level.includes(l))return true;}
 return false;
}

function render(){

  if(F.chars.size && !F.chars.has(c.char))return false;
  if(F.life.size && !F.life.has(c.life))return false;
  if(!levelMatch(c))return false;
  if(q){const blob=(c.term.ko+' '+c.term.en+' '+c.def.ko+' '+c.def.en+' '+c.id+' '+((c.reg&&c.reg.ko)||'')+' '+((c.reg&&c.reg.en)||'')).toLowerCase();
   if(!blob.includes(q))return false;}
  return true;
 });
 document.getElementById('count').textContent=`${T('showing')}: ${list.length} / ${D.claims.length}`;
 syncToggle('cv', catView);
 document.getElementById('grid').innerHTML=claimsBody(list, catView, 'grid');
}

// cursor-anchored tooltip (always visible at pointer; viewport-clamped)
var _tipEl=document.createElement('div');_tipEl.className='jstip';document.body.appendChild(_tipEl);
function _tipMove(e){
 if(_tipEl.style.display!=='block')return;
 var tw=_tipEl.offsetWidth,th=_tipEl.offsetHeight;
 var x=e.clientX+14,y=e.clientY+18;
 if(x+tw>window.innerWidth-8)x=e.clientX-tw-14;
 if(y+th>window.innerHeight-8)y=e.clientY-th-14;
 _tipEl.style.left=Math.max(8,x)+'px';_tipEl.style.top=Math.max(8,y)+'px';
}
document.addEventListener('mouseover',function(e){
 var t=e.target.closest?e.target.closest('[data-tip]'):null;
 if(!t){_tipEl.style.display='none';return;}
 _tipEl.textContent=t.getAttribute('data-tip');_tipEl.style.display='block';_tipMove(e);
});
document.addEventListener('mousemove',_tipMove);
window.addEventListener('scroll',function(){_tipEl.style.display='none';},true);

 const ch=D.chars[c.char]||{ko:c.char,en:c.char,ref:''};
 return `<div class="card" onclick='openM("${c.id}")'>
   <div class="hd"><span style="display:inline-flex;align-items:center;gap:7px">${logoOf(c.id,c.level,"",c.tfltype)}<span class="cid">${c.id}</span></span>${badge(c.level)}</div>
   <div class="bd">
    <div class="ctermrow"><span class="cterm">${c.term[lang]}</span></div>
    <span class="cchar">${ch[lang]} · ${ch.ref}</span> <span class="lifetag">${D.life_labels[c.life]?D.life_labels[c.life][lang]:c.life}</span>
    <div class="cdef" style="margin-top:8px">${c.def[lang]}</div>
    <div class="cmeta">${c.actors.map(a=>`<span class="actor" title="${D.actors[a]?D.actors[a][lang]:a}">${a}</span>`).join('')}</div>
   </div></div>`;
}
// 공통 3-모드 렌더 (catalog-view-toggle 패턴): claim 배열 → list/card/id HTML
function claimsBody(arr, mode, cls){
 cls = cls||'grid';
 if(mode==='card') return `<div class="${cls}">${arr.map(cCard).join('')}</div>`;
 if(mode==='id') return `<div class="chiprow cl-row">${arr.map(c=>
   `<span class="regchip" onclick='openM("${c.id}")' title="${c.term[lang]}">${c.id}</span>`).join('')}</div>`;
 return `<div class="stdlist">${arr.map(c=>{const ch=D.chars[c.char];
   return `<div class="stdrow" onclick='openM("${c.id}")'>${logoOf(c.id,c.level,'sm',c.tfltype)}<span class="cid">${c.id}</span>`+
     `<span class="srterm">${c.term[lang]}</span>`+
     `<span class="srchar">${ch?ch[lang]:c.char}</span>${badge(c.level)}</div>`;}).join('')}</div>`;
}
function syncToggle(prefix, mode){['list','card','id'].forEach(v=>{const b=document.getElementById(prefix+'-'+v);if(b)b.classList.toggle('on',mode===v);});}
function setStdView(v){stdView=v;renderStandards();}
function renderStandards(){
 syncToggle('sv', stdView);
 const lbl=T('lbl_chars');
 const byId=id=>D.claims.find(x=>x.id===id);
 document.getElementById('stdmap').innerHTML=D.stdmap.map(s=>{
  const head=`<h3>${s[lang]}<span class="cnt">${s.claims.length} claims · ${s.chars.length} ${lbl}</span></h3>`+
   `<div class="stdchars">${s.chars.map(ch=>`<span class="stdchar">${D.chars[ch]?D.chars[ch][lang]:ch}</span>`).join('')}</div>`;
  const arr=s.claims.map(byId).filter(Boolean);
  return `<div class="regframe">${head}${claimsBody(arr, stdView, 'grid stdgrid')}</div>`;
 }).join('');
}
function boot(){applyLangUI(langFromURL()||'ko');paintStatic();buildChips();renderOverview();render();renderProfiles();renderStakeholder();renderRegulatory();renderStandards();renderPhilosophy();applyRoute();}
boot();
</script>
