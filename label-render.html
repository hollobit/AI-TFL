<style>

body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5;padding:30px 16px 80px;

.top{max-width:980px;margin:0 auto 22px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.top h1{font-family:var(--serif);font-weight:900;font-size:24px;letter-spacing:-.01em}

#langbar{flex-wrap:wrap;justify-content:flex-end}#langbar button{white-space:nowrap}
@media(max-width:640px){#langbar{flex-basis:100%;justify-content:flex-start}#langbar button{padding:6px 9px}}

/* the label */
.label{border:2.5px solid var(--ink);background:var(--paper);box-shadow:7px 7px 0 rgba(27,24,19,.45)}

.meta .row{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.meta .row span:first-child{color:var(--ink2);font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.verdict{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.vbadge{font-family:var(--mono);font-size:11px;font-weight:700;padding:3px 9px;border:1.5px solid var(--ink)}

.vbadge.no{background:var(--accent);color:#fff;border-color:var(--accent)}
.vbadge.tier{background:var(--paper2)}
.anchor{padding:11px 18px;border-bottom:1px solid var(--ink);font-size:13.5px}
.anchor .lab{font-family:var(--mono);font-size:10px;text-transform:uppercase;color:var(--accent);font-weight:600;letter-spacing:.05em}
.epdbadge{font-family:var(--mono);font-size:9px;font-weight:700;background:var(--L3);color:#fff;padding:2px 6px;letter-spacing:.03em;align-self:center}
.qd{border-bottom:1px solid var(--ink);background:repeating-linear-gradient(-45deg,transparent,transparent 7px,rgba(44,122,79,.05) 7px,rgba(44,122,79,.05) 14px);padding:11px 18px}
.qd-h{font-family:var(--mono);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--L3);margin-bottom:6px}
.qd-row{display:flex;gap:10px;padding:2px 0;font-size:12.5px}
.qd-row span:first-child{color:var(--ink2);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.03em;min-width:118px;flex-shrink:0}
.qd-cmp{margin-top:7px;font-size:11px;color:var(--ink2);border-left:3px solid var(--L3);padding:4px 9px;background:var(--paper)}
.grp{border-bottom:1px solid var(--ink)}
.grp:last-child{border-bottom:0}
.grp h3{font-family:var(--mono);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;
 background:var(--paper2);padding:6px 18px;border-bottom:1px solid var(--ink);display:flex;justify-content:space-between}
.cl{padding:9px 18px;border-bottom:1px dotted #c7bda8}
.clogo{width:24px;height:24px;flex-shrink:0;color:var(--accent);display:inline-flex;align-self:flex-start;margin-top:1px}
.clogo svg{width:100%;height:100%}
.clogo[onclick]{cursor:pointer}
.clogo.sm{width:18px;height:18px;flex-shrink:0;align-self:center;margin-top:0}
.clogo.lv2,.clogo.lvc2{color:var(--L2)}
.clogo.lvc3{color:var(--L3)}
.clogo.lvci{color:var(--ink)}
.lgh .tierb.t3{background:var(--ink)}
.jstip{position:fixed;display:none;z-index:2147483000;background:var(--ink);color:var(--paper);font-family:var(--sans);font-size:11.5px;font-weight:400;line-height:1.45;text-align:left;padding:7px 10px;max-width:260px;pointer-events:none;box-shadow:3px 3px 0 rgba(27,24,19,.3)}
.lgtabs{display:flex;gap:6px;flex-wrap:wrap;padding:12px 18px 0}
.lgtabs button{font-family:var(--mono);font-size:11px;font-weight:600;border:1.5px solid var(--ink);background:var(--paper);padding:5px 10px;cursor:pointer;color:var(--ink)}
.lgtabs button.on{background:var(--ink);color:var(--paper)}
.lgh{display:flex;align-items:center;gap:8px;padding:14px 18px 0}
.lgh .tierb{font-family:var(--mono);font-size:10px;font-weight:700;color:#fff;padding:2px 7px}
.lgh .tierb.l1{background:var(--L1)}.lgh .tierb.l2{background:var(--L2)}.lgh .tierb.l3{background:var(--L3)}
.lgh .lgn{font-family:var(--mono);font-size:11px;color:var(--ink2)}
.clogo.xl{width:96px;height:96px;margin:0 auto}
.logogal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:18px}
.lgi{border:1.5px solid var(--ink);background:var(--paper);padding:18px 12px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;cursor:pointer;transition:transform .12s,box-shadow .12s}
.lgi:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--ink)}
.cmodal{position:fixed;inset:0;background:rgba(27,24,19,.45);display:none;z-index:100;padding:24px}
.cmodal.on{display:flex;align-items:flex-start;justify-content:center}
.csheet{background:var(--paper);border:2px solid var(--ink);max-width:680px;width:100%;max-height:88vh;overflow:auto;box-shadow:8px 8px 0 rgba(27,24,19,.35)}
.cshd{position:sticky;top:0;background:var(--paper);border-bottom:2px solid var(--ink);padding:14px 18px;display:flex;align-items:flex-start;gap:12px}
.cshd h3{font-family:var(--serif);font-weight:700;font-size:19px;line-height:1.2}
.cshd .csub{font-family:var(--mono);font-size:11px;color:var(--ink2);margin-top:3px}
.cshd .cx{border:1.5px solid var(--ink);background:var(--paper);font-size:16px;font-weight:700;width:30px;height:30px;cursor:pointer;flex-shrink:0}
.csbd{padding:12px 18px 18px}
.cfield{padding:8px 0;border-bottom:1px dotted #c7bda8}
.cfield:last-child{border-bottom:0}
.cfl{font-family:var(--mono);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--accent);margin-bottom:3px}
.cfv{font-size:13.5px;line-height:1.5}
.cshd .clogo.xl{width:44px;height:44px;margin:0}
.lgi .lgid{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--accent)}
.lgi .lgnm{font-family:var(--serif);font-weight:600;font-size:13.5px;line-height:1.25}
.tflbtns button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.cl:last-child{border-bottom:0}
.cl .hd{display:flex;align-items:center;gap:10px;justify-content:space-between}
.cl .nm{font-family:var(--serif);font-weight:600;font-size:15.5px;flex:1}

.bdg{font-family:var(--mono);font-size:9.5px;font-weight:700;color:#fff;padding:2px 6px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.bdg.l1{background:var(--L1);opacity:.78}.bdg.l2{background:var(--L2)}.bdg.l3{background:var(--L3)}
/* front-of-pack */
.fop{display:flex;gap:14px;align-items:stretch;border-bottom:6px solid var(--ink);padding:14px 18px;background:var(--paper2)}
.grade{flex-shrink:0;width:84px;border:2.5px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--paper)}
.grade .g{font-family:var(--serif);font-weight:900;font-size:46px;line-height:.9}
.grade .gl{font-family:var(--mono);font-size:8px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2);margin-top:3px;text-align:center;padding:0 3px}
.grade.gA{background:#dff0e4}.grade.gB{background:#e1ecf5}.grade.gC{background:#f5ecd6}.grade.gD{background:#e9e2d0}.grade.gE{background:#f3ddd7}

.sig{border:1px solid var(--ink);background:var(--paper);padding:5px 9px;display:flex;flex-direction:column;gap:2px}
.sig .st{font-family:var(--sans);font-weight:600;font-size:12.5px;display:flex;justify-content:space-between;gap:6px;align-items:baseline}
.sig .sv{font-family:var(--mono);font-size:11px;font-weight:700}
.sig .sb{font-family:var(--mono);font-size:8.5px;font-weight:700;color:#fff;padding:1px 4px;align-self:flex-start}
.sig .sb.l1{background:var(--L1);opacity:.78}.sig .sb.l2{background:var(--L2)}.sig .sb.l3{background:var(--L3)}
.fopcap{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2)}
.cstag{font-family:var(--mono);font-size:8.5px;font-weight:700;color:#fff;padding:1px 5px;margin-left:6px;vertical-align:middle}
.cstag.l1{background:var(--L1);opacity:.78}.cstag.l2{background:var(--L2)}.cstag.l3{background:var(--L3)}
body.b2c .grp,body.b2c .anchor,body.b2c .na{display:none}
body.b2b .fop .fopcap{display:none}
.cl .stmt{font-size:12.5px;color:var(--ink2);margin-top:4px}
.cl .ev{font-family:var(--mono);font-size:10.5px;margin-top:4px;display:flex;flex-wrap:wrap;gap:8px}

.sw{width:12px;height:12px;display:inline-block;border:1px solid var(--ink)}

.side{position:sticky;top:20px}

.tflmenu{margin-top:12px}
.tflmenu-lab{font-family:var(--mono);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink2)}
.tflbtns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tflbtns button{font-family:var(--mono);font-size:11px;font-weight:600;border:1.5px solid var(--ink);background:var(--paper);padding:5px 9px;cursor:pointer;color:var(--ink)}
.tflbtns button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.tfldesc{font-size:12px;line-height:1.5;color:var(--ink);background:var(--paper2);border-left:3px solid var(--accent);padding:9px 12px;margin-top:8px;display:none}

.mccmp{width:100%;border-collapse:collapse;margin-top:9px;font-size:11px;background:var(--paper)}
.mccmp th{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.03em;text-align:left;background:var(--ink);color:var(--paper);padding:4px 7px}
.mccmp td{padding:4px 7px;border-bottom:1px solid #d8cfb8;vertical-align:top}
.mccmp td:first-child{font-family:var(--serif);font-weight:600}
.mccmp td:last-child{font-family:var(--mono);font-size:10px;color:var(--L3);white-space:nowrap}
.mccmp tr:last-child td{border-bottom:0;background:var(--paper2)}
.err{font-family:var(--mono);font-size:11.5px;color:var(--accent);margin-top:8px;white-space:pre-wrap}
.hint{font-size:11.5px;color:var(--ink2);margin-top:8px}
.b2b-only{display:block}
body.b2c .b2b-only{display:none}
body.b2c .cl .stmt{display:none}

: "accountability", "status": "declared", "value": true, "verificationLevel": "L1", "explanatoryStatement": "Organización responsable: ExampleCorp Model Team, contacto https://example.com/ai-trust/contact.", "standardRef": "ISO/IEC 42001 (sistema de gestión de la IA)"}], "guardrailAttestation": {"noAbsoluteClaims": true, "noAdjectiveClaims": true, "perClaimVerificationBadge": true, "tamperEvidentTermsOnly": true}, "naApplicability": [{"characteristic": "authenticity", "reason": "Sin salidas generativas — autenticidad no aplicable"}]}}}, "tflTypeIds": ["I", "II", "III", "IV"], "tflTypes": {"I": {"label": {"ko": "Type I · 제3자 인증", "en": "Type I · 3rd-party certified", "zh": "Type I · 第三方认证", "de": "Type I · durch Dritte zertifiziert", "fr": "Type I · certifié par une 3e partie", "es": "Type I · certificado de 3.ª parte"}, "desc": {"ko": "라벨 전체를 제3자가 인증 → eco-label ISO 14024와 동형의 홀리스틱 씰이므로 **전 claim이 L3(제3자 검증)**. 고지·책임주체 baseline까지 인증기관이 확인. 예: AIMS(42001)·품질(9001)·보안(27001)·안전·편향. 각 claim에 인증기관·인증번호·범위·유효기간 첨부.", "en": "The whole label is third-party certified — a holistic seal like eco-label ISO 14024, so **every claim is L3 (third-party verified)**, including the AI-disclosure and accountable-party baseline. E.g., AIMS (42001), quality (9001), security (27001), safety, bias. Each claim carries certifier, certificate no., scope, validity.", "zh": "整个标签由第三方认证——与 eco-label ISO 14024 同构的整体印章，因此**每个 claim 均为 L3（第三方验证）**，连 AI 告知·责任主体 baseline 也由认证机构确认。如 AIMS(42001)·质量(9001)·安全保障(27001)·安全·偏见。每个 claim 附认证机构·证书编号·范围·有效期。", "de": "Das gesamte Label ist durch Dritte zertifiziert – ein ganzheitliches Siegel wie das Umweltzeichen nach ISO 14024; daher ist **jeder Claim L3 (durch Dritte verifiziert)**, einschließlich der Basisanforderungen KI-Offenlegung und verantwortliche Stelle. Z. B. AIMS (42001), Qualität (9001), IT-Sicherheit (27001), Sicherheit, Bias. Jeder Claim enthält Zertifizierer, Zertifikatsnr., Geltungsbereich und Gültigkeit.", "fr": "L'ensemble de l'étiquette est certifié par une tierce partie — un label global comme l'écolabel ISO 14024 ; **chaque claim est donc L3 (vérifié par une tierce partie)**, y compris le socle de divulgation de l'IA et de partie responsable. Par ex. AIMS (42001), qualité (9001), sécurité (27001), sûreté, biais. Chaque claim comporte le certificateur, le n° de certificat, le périmètre et la validité.", "es": "Toda la etiqueta está certificada por terceros, un sello integral como la ecoetiqueta ISO 14024, por lo que **todos los claims son L3 (verificados por terceros)**, incluida la base mínima de divulgación de IA y parte responsable. P. ej., AIMS (42001), calidad (9001), seguridad (security) (27001), seguridad (safety), sesgo. Cada claim incluye certificador, n.º de certificado, alcance y vigencia."}}, "II": {"label": {"ko": "Type II · 자기선언", "en": "Type II · self-declared", "zh": "Type II · 自我声明", "de": "Type II · selbst erklärt", "fr": "Type II · autodéclaré", "es": "Type II · autodeclarado"}, "desc": {"ko": "제공자가 **입증 가능한 특정 속성만 골라** 자기선언(eco-label ISO 14021과 동형 — à la carte). 포괄 패널이 아니라 **소수의 구체적 claim**(예: '학습 미사용'·'AI 생성 표기')을 선택 선언. 규율: 항목별 구체성·비모호(형용사 금지)·입증자료 보유. baseline(AI 고지·책임주체)만 시장 무결성 최소 floor. ※ 더 많은 특성을 선언하고 싶으면 제품유형 예제(포괄 패널) 참조.", "en": "The provider self-declares **only the specific attributes it can substantiate** (like eco-label ISO 14021 — à la carte): not a comprehensive panel but a **few specific claims** (e.g., 'no training on inputs', 'AI-generated marked'). Discipline: per-claim specificity, no vague adjectives, evidence on hand. Only the baseline (AI disclosure + accountable party) is a market-integrity floor. (For a fuller panel, see the product-type examples.)", "zh": "提供方**仅选择其可证实的特定属性**自行声明（与 eco-label ISO 14021 同构——按需/à la carte）：并非综合面板，而是**少数具体 claim**（如“不用于训练”·“标注 AI 生成”）。纪律：逐项具体·不含糊（禁形容词）·备有证据。仅 baseline（AI 告知·责任主体）为市场诚信底线。（如需更完整面板，参见产品类型示例。）", "de": "Der Anbieter erklärt selbst **nur die spezifischen Eigenschaften, die er substantiieren kann** (wie beim Umweltzeichen nach ISO 14021 – à la carte): kein umfassendes Feld, sondern **wenige spezifische Claims** (z. B. „kein Training mit Eingaben“, „KI-generiert gekennzeichnet“). Disziplin: Spezifität pro Claim, keine vagen Adjektive, vorliegende Nachweise. Nur die Basisanforderungen (KI-Offenlegung + verantwortliche Stelle) bilden eine Untergrenze für die Marktintegrität. (Für ein umfassenderes Feld siehe die Beispiele nach Produkttyp.)", "fr": "Le fournisseur autodéclare **uniquement les attributs spécifiques qu'il peut justifier** (comme l'écolabel ISO 14021 — à la carte) : non pas un panneau complet, mais **quelques claims spécifiques** (par ex. « pas d'entraînement sur les entrées », « marquage généré par IA »). Discipline : spécificité par claim, aucun adjectif vague, preuves disponibles. Seul le socle (divulgation de l'IA + partie responsable) constitue un plancher d'intégrité du marché. (Pour un panneau plus complet, voir les exemples par type de produit.)", "es": "El proveedor autodeclara **solo los atributos específicos que puede fundamentar** (como la ecoetiqueta ISO 14021, a la carta): no un panel exhaustivo, sino **unos pocos claims específicos** (p. ej., 'no entrena con las entradas', 'marcado como generado por IA'). Disciplina: especificidad por claim, sin adjetivos vagos, evidencia disponible. Solo la base mínima (divulgación de IA + parte responsable) constituye un umbral de integridad del mercado. (Para un panel más completo, véanse los ejemplos por tipo de producto)."}}, "III": {"label": {"ko": "Type III · 생애주기 정량평가", "en": "Type III · lifecycle quantitative", "zh": "Type III · 生命周期定量", "de": "Type III · quantitativ über den Lebenszyklus", "fr": "Type III · quantitatif du cycle de vie", "es": "Type III · cuantitativo del ciclo de vida"}, "desc": {"ko": "AI 모델·데이터의 **생성→개발→유통→사용→폐기 전 생애주기**가 신뢰성에 미치는 영향을 **10대 영향범주**로 정량 측정·제3자 검증하는 정량선언(환경 LCA/EPD ISO 14025와 동형). 각 범주는 **SC 42 표준의 요구사항**에 따라 벤치마크 세트 등 객관 지표로 정량화(benchmark는 평가 수단, 비해당 항목은 표준 측정법). **Type III 라벨을 단다는 것 = 그 기업이 '개발·사용 전 과정에서 AI 안전·신뢰성 향상에 힘쓰고 있음'을 정량 데이터로 투명 공개하고 독립 검증받아 자부하는 것**(환경 책임을 EPD로 증명하듯). 선언단위·등록번호·비교면책 포함, **순위·합격판정 없이** 데이터 공시. ↓ 10대 영향범주:", "en": "A quantitative declaration of how the **full AI lifecycle — generation → development → distribution → use → retirement** affects trustworthiness, measured across **10 impact categories** and third-party verified (like an environmental LCA/EPD, ISO 14025). Each category is quantified per **SC 42 standard requirements** using benchmark sets and objective indicators (a benchmark is the instrument; where none applies, the standard's own method). **Displaying a Type III label means the company transparently discloses, with quantitative data and independent verification, that it strives to improve AI safety & trustworthiness across development and use** — as an EPD attests environmental responsibility. Includes declared unit, registration no., comparability disclaimer; published as data — **no ranking, no pass/fail**. ↓ the 10 impact categories:", "zh": "对 **AI 全生命周期——生成 → 开发 → 流通 → 使用 → 退役** 如何影响可信性进行定量测量并第三方验证的定量声明（与环境 LCA/EPD、ISO 14025 同构），以 **10 大影响范畴** 表示。每个范畴依据 **SC 42 标准要求**、以基准集等客观指标定量化（基准为手段；不适用时采用标准自身方法）。**加贴 Type III 标签意味着：该企业以定量数据与独立验证透明公开其在开发与使用全过程中努力提升 AI 安全与可信性**（如 EPD 证明环境责任）。含声明单位·注册号·可比性免责；作为数据公示——**无排名·无合格判定**。↓ 10 大影响范畴：", "de": "Eine quantitative Deklaration darüber, wie sich der **gesamte KI-Lebenszyklus – Erzeugung → Entwicklung → Vertrieb → Nutzung → Außerbetriebnahme** auf die Vertrauenswürdigkeit auswirkt, gemessen in **10 Wirkungskategorien** und durch Dritte verifiziert (wie eine Umwelt-LCA/EPD, ISO 14025). Jede Kategorie wird gemäß den **Anforderungen der SC-42-Normen** anhand von Benchmark-Sets und objektiven Indikatoren quantifiziert (ein Benchmark ist das Messinstrument; wo keiner anwendbar ist, das Verfahren der Norm selbst). **Die Anbringung eines Type-III-Labels bedeutet, dass das Unternehmen mit quantitativen Daten und unabhängiger Verifizierung transparent offenlegt, dass es sich um die Verbesserung von KI-Sicherheit und Vertrauenswürdigkeit in Entwicklung und Nutzung bemüht** – so wie eine EPD Umweltverantwortung bescheinigt. Enthält deklarierte Einheit, Registriernummer und Vergleichbarkeitshinweis; veröffentlicht als Daten – **keine Rangfolge, kein Bestanden/Nicht bestanden**. ↓ die 10 Wirkungskategorien:", "fr": "Déclaration quantitative de l'incidence du **cycle de vie complet de l'IA — génération → développement → distribution → utilisation → retrait** sur le caractère digne de confiance, mesurée selon **10 catégories d'impact** et vérifiée par une tierce partie (comme une ACV/EPD environnementale, ISO 14025). Chaque catégorie est quantifiée selon les **exigences des normes du SC 42** au moyen de jeux de benchmarks et d'indicateurs objectifs (le benchmark est l'instrument ; à défaut, la méthode propre à la norme). **Afficher une étiquette Type III signifie que l'entreprise divulgue de manière transparente, avec des données quantitatives et une vérification indépendante, qu'elle s'efforce d'améliorer la sûreté et le caractère digne de confiance de l'IA tout au long du développement et de l'utilisation** — comme une EPD atteste la responsabilité environnementale. Comprend l'unité déclarée, le numéro d'enregistrement et un avertissement sur la comparabilité ; publiée sous forme de données — **ni classement, ni réussite/échec**. ↓ les 10 catégories d'impact :", "es": "Una declaración cuantitativa de cómo **todo el ciclo de vida de la IA —generación → desarrollo → distribución → uso → retirada—** afecta a la confiabilidad, medida en **10 categorías de impacto** y verificada por terceros (como un ACV/EPD ambiental, ISO 14025). Cada categoría se cuantifica según los **requisitos de las normas de SC 42** mediante conjuntos de benchmarks e indicadores objetivos (un benchmark es el instrumento; cuando no aplica ninguno, el método propio de la norma). **Mostrar una etiqueta Type III significa que la empresa divulga de forma transparente, con datos cuantitativos y verificación independiente, que se esfuerza por mejorar la seguridad y la confiabilidad de la IA en el desarrollo y el uso**, del mismo modo que una EPD acredita la responsabilidad ambiental. Incluye unidad declarada, n.º de registro y descargo de comparabilidad; se publica como datos: **sin clasificación, sin aprobado/suspenso**. ↓ las 10 categorías de impacto:"}, "impactLife": {"gen": {"ko": "생성", "en": "Generation", "zh": "生成", "de": "Erzeugung", "fr": "Génération", "es": "Generación"}, "dev": {"ko": "개발", "en": "Development", "zh": "开发", "de": "Entwicklung", "fr": "Développement", "es": "Desarrollo"}, "dist": {"ko": "유통", "en": "Distribution", "zh": "流通", "de": "Vertrieb", "fr": "Distribution", "es": "Distribución"}, "use": {"ko": "사용", "en": "Use", "zh": "使用", "de": "Nutzung", "fr": "Utilisation", "es": "Uso"}, "ret": {"ko": "폐기", "en": "Retirement", "zh": "退役", "de": "Außerbetriebnahme", "fr": "Retrait", "es": "Retirada"}}, "impacts": [{"cat": {"ko": "① 데이터 품질·대표성", "en": "① Data quality & representativeness", "zh": "① 数据质量·代表性", "de": "① Datenqualität & Repräsentativität", "fr": "① Qualité et représentativité des données", "es": "① Calidad y representatividad de los datos"}, "life": "gen", "ind": "QUA-3 · DQ metrics", "std": "5259-2"}, {"cat": {"ko": "② 탄소·자원 발자국", "en": "② Carbon & resource footprint", "zh": "② 碳·资源足迹", "de": "② CO2- & Ressourcenfußabdruck", "fr": "② Empreinte carbone et ressources", "es": "② Huella de carbono y de recursos"}, "life": "gen", "ind": "SUS-1 · tCO2e·MWh", "std": "TR 20226"}, {"cat": {"ko": "③ 정확도·역량", "en": "③ Accuracy & capability", "zh": "③ 准确性·能力", "de": "③ Genauigkeit & Fähigkeit", "fr": "③ Exactitude et capacités", "es": "③ Exactitud y capacidad"}, "life": "dev", "ind": "ACU-1 · MMLU/HELM", "std": "TS 4213"}, {"cat": {"ko": "④ 견고성", "en": "④ Robustness", "zh": "④ 鲁棒性", "de": "④ Robustheit", "fr": "④ Robustesse", "es": "④ Robustez"}, "life": "dev", "ind": "ROB-1 · AdvGLUE/RobustBench", "std": "24029-2"}, {"cat": {"ko": "⑤ 공정성·편향", "en": "⑤ Fairness & bias", "zh": "⑤ 公平性·偏见", "de": "⑤ Fairness & Bias", "fr": "⑤ Équité et biais", "es": "⑤ Equidad y sesgo"}, "life": "dev", "ind": "FAI-1 · BBQ/HolisticBias", "std": "TR 24027"}, {"cat": {"ko": "⑥ 투명성·설명충실도", "en": "⑥ Transparency & explanation faithfulness", "zh": "⑥ 透明性·解释忠实度", "de": "⑥ Transparenz & Treue der Erklärungen", "fr": "⑥ Transparence et fidélité des explications", "es": "⑥ Transparencia y fidelidad de la explicación"}, "life": "dist", "ind": "EXP-2 · faithfulness eval", "std": "TS 6254"}, {"cat": {"ko": "⑦ 안전·유해성", "en": "⑦ Safety & harm", "zh": "⑦ 安全·危害", "de": "⑦ Sicherheit & Schaden", "fr": "⑦ Sûreté et préjudices", "es": "⑦ Seguridad (safety) y daños"}, "life": "use", "ind": "SAF-1 · HarmBench/JailbreakBench", "std": "TS 42119-7"}, {"cat": {"ko": "⑧ 보안·공격 내성", "en": "⑧ Security & attack resistance", "zh": "⑧ 安全防护·抗攻击", "de": "⑧ IT-Sicherheit & Angriffsresistenz", "fr": "⑧ Sécurité et résistance aux attaques", "es": "⑧ Seguridad (security) y resistencia a ataques"}, "life": "use", "ind": "SEC-4 · prompt-injection bench", "std": "27090"}, {"cat": {"ko": "⑨ 프라이버시·기억화", "en": "⑨ Privacy & memorization", "zh": "⑨ 隐私·记忆化", "de": "⑨ Privatsphäre & Memorisierung", "fr": "⑨ Vie privée et mémorisation", "es": "⑨ Privacidad y memorización"}, "life": "use", "ind": "PRV-6 · MIA/extraction", "std": "27091"}, {"cat": {"ko": "⑩ 데이터 삭제·모델 폐기", "en": "⑩ Data deletion & model retirement", "zh": "⑩ 数据删除·模型退役", "de": "⑩ Datenlöschung & Außerbetriebnahme des Modells", "fr": "⑩ Effacement des données et retrait du modèle", "es": "⑩ Eliminación de datos y retirada del modelo"}, "life": "ret", "ind": "PRV-5 · TOFU unlearning", "std": "8183/5338"}]}, "IV": {"label": {"ko": "Type IV · 개발자 기술카드(DTC)", "en": "Type IV · Developer Technical Card", "zh": "Type IV · 开发者技术卡(DTC)", "de": "Type IV · Developer Technical Card", "fr": "Type IV · Fiche technique développeur", "es": "Type IV · Ficha técnica del desarrollador"}, "desc": {"ko": "개발자 기술카드(DTC) — model card와 유사하나 확장. 【유사】의도용도·학습데이터·아키텍처·계보·평가·한계를 구조적으로 공시(TRA-5·8·9·10·11). 【차이(DTC 추가)】①claim별 검증등급(L1/L2/L3) 배지 ②변조내성 용어만(형용사·최상급 금지) ③다운스트림 통합정보(TRA-12) ④기계가독 라벨로 하류 재선언 ⑤42117-X Type IV 표준 트랙. 각 공시 항목은 **SC 42 투명성·문서화 표준**을 참조 — 모델기술 ISO/IEC 25623·투명성분류 12792·데이터수명주기 8183·수명주기 5338·AIMS 42001. (model card는 자유서술·검증표시·표준참조가 없다.)", "en": "Developer Technical Card (DTC) — like a model card but extended. [Same] structured disclosure of intended use, training data, architecture, lineage, evaluation, limits (TRA-5·8·9·10·11). [Different — DTC adds] ① per-claim verification tier (L1/L2/L3) badges ② tamper-evident wording only (no adjectives/superlatives) ③ downstream-integration info (TRA-12) ④ machine-readable label for downstream re-declaration ⑤ standardized 42117-X Type IV track. Each disclosure references an **SC 42 transparency/documentation standard** — model description ISO/IEC 25623, transparency taxonomy 12792, data life cycle 8183, life cycle 5338, AIMS 42001. (A model card is free prose with no verification marking or standard reference.)", "zh": "开发者技术卡(DTC)——类似模型卡但更扩展。【相同】结构化披露预期用途·训练数据·架构·谱系·评估·局限（TRA-5·8·9·10·11）。【不同——DTC 增加】①每个 claim 的验证等级(L1/L2/L3)徽章 ②仅用防篡改措辞（禁形容词·最高级）③下游集成信息(TRA-12) ④机器可读标签供下游再声明 ⑤标准化 42117-X Type IV 轨道。每项披露均参照 **SC 42 透明性·文档化标准** —— 模型描述 ISO/IEC 25623·透明性分类 12792·数据生命周期 8183·生命周期 5338·AIMS 42001。（模型卡为自由叙述、无验证标记与标准参照。）", "de": "Developer Technical Card (DTC) – wie eine Model Card, aber erweitert. [Gleich] strukturierte Offenlegung von Zweckbestimmung, Trainingsdaten, Architektur, Abstammung, Bewertung, Grenzen (TRA-5·8·9·10·11). [Unterschiedlich – DTC ergänzt] ① Plaketten der Verifizierungsstufe (L1/L2/L3) pro Claim ② ausschließlich manipulationsfeste Formulierungen (keine Adjektive/Superlative) ③ Informationen zur nachgelagerten Integration (TRA-12) ④ maschinenlesbares Label für die nachgelagerte Neudeklaration ⑤ standardisierter Pfad 42117-X Type IV. Jede Offenlegung verweist auf eine **SC-42-Norm für Transparenz/Dokumentation** – Modellbeschreibung ISO/IEC 25623, Transparenztaxonomie 12792, Datenlebenszyklus 8183, Lebenszyklus 5338, AIMS 42001. (Eine Model Card ist freier Fließtext ohne Verifizierungskennzeichnung oder Normverweis.)", "fr": "Fiche technique développeur (DTC) — comparable à une fiche de modèle, mais étendue. [Points communs] divulgation structurée de l'usage prévu, des données d'entraînement, de l'architecture, de la filiation, de l'évaluation et des limites (TRA-5·8·9·10·11). [Différences — la DTC ajoute] ① des badges de niveau de vérification (L1/L2/L3) par claim ② une formulation exclusivement vérifiable (ni adjectifs ni superlatifs) ③ des informations d'intégration en aval (TRA-12) ④ une étiquette lisible par machine pour une nouvelle déclaration en aval ⑤ une filière normalisée 42117-X Type IV. Chaque divulgation fait référence à une **norme de transparence/documentation du SC 42** — description de modèle ISO/IEC 25623, taxonomie de la transparence 12792, cycle de vie des données 8183, cycle de vie 5338, AIMS 42001. (Une fiche de modèle est une prose libre, sans marquage de vérification ni référence normative.)", "es": "Ficha técnica del desarrollador (DTC): como una model card, pero ampliada. [Igual] divulgación estructurada del uso previsto, los datos de entrenamiento, la arquitectura, el linaje, la evaluación y los límites (TRA-5·8·9·10·11). [Diferente: la DTC añade] ① insignias de nivel de verificación por claim (L1/L2/L3) ② únicamente redacción a prueba de manipulaciones (sin adjetivos/superlativos) ③ información para la integración descendente (TRA-12) ④ etiqueta legible por máquina para la nueva declaración aguas abajo ⑤ vía normalizada 42117-X Type IV. Cada divulgación hace referencia a una **norma de transparencia/documentación de SC 42**: descripción de modelos ISO/IEC 25623, taxonomía de transparencia 12792, ciclo de vida de los datos 8183, ciclo de vida 5338, AIMS 42001. (Una model card es prosa libre sin marcado de verificación ni referencia normativa)."}, "compare": [{"mc": {"ko": "Model Details 모델 상세", "en": "Model Details", "zh": "Model Details 模型详情", "de": "Modelldetails", "fr": "Détails du modèle", "es": "Detalles del modelo"}, "dtc": "TRA-9 · TRA-10", "std": "25623"}, {"mc": {"ko": "Intended Use 의도된 용도", "en": "Intended Use", "zh": "Intended Use 预期用途", "de": "Zweckbestimmung", "fr": "Usage prévu", "es": "Uso previsto"}, "dtc": "TRA-11", "std": "12792"}, {"mc": {"ko": "Out-of-Scope Uses 비대상 용도", "en": "Out-of-Scope Uses", "zh": "Out-of-Scope 超范围用途", "de": "Nutzungen außerhalb des Geltungsbereichs", "fr": "Usages hors périmètre", "es": "Usos fuera de alcance"}, "dtc": "TRA-7", "std": "12792"}, {"mc": {"ko": "Training Data 학습 데이터", "en": "Training Data", "zh": "Training Data 训练数据", "de": "Trainingsdaten", "fr": "Données d'entraînement", "es": "Datos de entrenamiento"}, "dtc": "TRA-8", "std": "8183"}, {"mc": {"ko": "Metrics 평가 지표", "en": "Metrics", "zh": "Metrics 评估指标", "de": "Metriken", "fr": "Métriques", "es": "Métricas"}, "dtc": "ACU-1", "std": "TS 4213"}, {"mc": {"ko": "Quantitative Analyses 정량 분석", "en": "Quantitative Analyses", "zh": "Quantitative Analyses 定量分析", "de": "Quantitative Analysen", "fr": "Analyses quantitatives", "es": "Análisis cuantitativos"}, "dtc": "FAI-1", "std": "TR 24027"}, {"mc": {"ko": "Ethical Considerations 윤리 고려", "en": "Ethical Considerations", "zh": "Ethical Considerations 伦理考量", "de": "Ethische Erwägungen", "fr": "Considérations éthiques", "es": "Consideraciones éticas"}, "dtc": "RSK-1", "std": "23894"}, {"mc": {"ko": "Caveats & Recommendations 한계·권고", "en": "Caveats & Recommendations", "zh": "Caveats 局限与建议", "de": "Vorbehalte & Empfehlungen", "fr": "Mises en garde et recommandations", "es": "Advertencias y recomendaciones"}, "dtc": "RSK-1 · TRA-5", "std": "23894"}, {"mc": {"ko": "— (Model Card엔 없음)", "en": "— (not in a Model Card)", "zh": "—（Model Card 无）", "de": "— (nicht in einer Model Card)", "fr": "— (absent d'une Model Card)", "es": "— (no figura en u ffen, dass Sie mit einer KI interagieren", "fr": "Bulle avec IA — indique que vous interagissez avec une IA", "es": "Bocadillo con IA — divulga que usted está interactuando con una IA"}, "ACC-1": {"ko": "ID 카드 — 책임 조직·연락처를 식별 공개", "en": "ID card — identifies the accountable organization and contact", "zh": "身份卡——公开责任组织与联系方式", "de": "Ausweis – identifiziert die verantwortliche Organisation und den Kontakt", "fr": "Carte d'identité — identifie l'organisation responsable et le contact", "es": "Tarjeta de identificación — identifica a la organización responsable y el contacto"}, "PRV-1": {"ko": "데이터 실린더+금지선 — 입력을 재학습에 사용하지 않음", "en": "Database with slash — inputs are not used for retraining", "zh": "数据缸+禁止线——输入不用于再训练", "de": "Datenbank mit Schrägstrich – Eingaben werden nicht für Nachtraining verwendet", "fr": "Base de données barrée — les entrées ne sont pas utilisées pour le réentraînement", "es": "Base de datos tachada — las entradas no se utilizan para reentrenar"}, "AUT-2": {"ko": "콘텐츠 태그+AI — AI 생성 콘텐츠임을 표기", "en": "Content tag with AI — marks content as AI-generated", "zh": "内容标签+AI——标注为 AI 生成内容", "de": "Inhaltsmarke mit KI – kennzeichnet Inhalte als KI-generiert", "fr": "Étiquette de contenu avec IA — signale un contenu généré par IA", "es": "Etiqueta de contenido con IA — marca el contenido como generado por IA"}, "SAF-3": {"ko": "방패+기어 — 레드팀 테스팅 체계(프로세스) 운영", "en": "Shield with gear — operates a red-team testing process", "zh": "盾+齿轮——运营红队测试体系", "de": "Schild mit Zahnrad – betreibt einen Red-Team-Testprozess", "fr": "Bouclier avec engrenage — exploite un processus de tests de red teaming", "es": "Escudo con engranaje — opera un proceso de pruebas de red team"}, "SAF-4": {"ko": "방패+체크 — 레드팀 테스팅 수행·조치 완료", "en": "Shield with check — red-team testing performed and remediated", "zh": "盾+对勾——已执行红队测试并整改", "de": "Schild mit Häkchen – Red-Team-Tests durchgeführt und Befunde behoben", "fr": "Bouclier coché — tests de red teaming réalisés et corrections apportées", "es": "Escudo con marca de verificación — pruebas de red team realizadas y remediadas"}, "ACC-3": {"ko": "종 — 사고 접수·대응 채널 운영", "en": "Bell — incident intake and response operated", "zh": "铃——运营事故受理与响应渠道", "de": "Glocke – Annahme und Bearbeitung von Vorfällen betrieben", "fr": "Cloche — réception et traitement des incidents opérés", "es": "Campana — recepción y respuesta a incidentes operadas"}, "ACC-4": {"ko": "로그+시계 — 의사결정 기록을 추적가능하게 보존", "en": "Log lines with clock — decision records kept traceable", "zh": "日志+时钟——决策记录可追溯保存", "de": "Protokollzeilen mit Uhr – Entscheidungsaufzeichnungen nachvollziehbar aufbewahrt", "fr": "Lignes de journal avec horloge — enregistrements des décisions conservés de façon traçable", "es": "Líneas de registro con reloj — registros de decisiones trazables"}, "ACC-5": {"ko": "순환+! — 위험을 상시 관리하는 체계 운영", "en": "Cycle with ! — continuous risk management operated", "zh": "循环+!——持续运营风险管理体系", "de": "Kreislauf mit ! – kontinuierliches Risikomanagement betrieben", "fr": "Cycle avec ! — gestion continue des risques opérée", "es": "Ciclo con ! — gestión continua de riesgos operada"}, "ACC-6": {"ko": "저울 — 책임·배상 약정 명시", "en": "Scales — liability and redress commitments stated", "zh": "天平——明示责任与赔偿承诺", "de": "Waage – Zusagen zu Haftung und Abhilfe angegeben", "fr": "Balance — engagements de responsabilité et de réparation énoncés", "es": "Balanza — compromisos de responsabilidad y reparación declarados"}, "ACC-7": {"ko": "우산+© — IP 침해 주장으로부터 보호(면책)", "en": "Umbrella with © — indemnity against IP claims", "zh": "雨伞+©——知识产权索赔免责保护", "de": "Regenschirm mit © – Freistellung gegen IP-Ansprüche", "fr": "Parapluie avec © — indemnisation contre les réclamations en matière de PI", "es": "Paraguas con © — indemnización frente a reclamaciones de PI"}, "AUT-3": {"ko": "사람+체크 — 상대 주체의 진정성(사칭 아님) 고지", "en": "Person with check — authentic identity, not impersonation", "zh": "人+对勾——主体真实、非冒充", "de": "Person mit Häkchen – authentische Identität, keine Identitätsvortäuschun function _tipMove(e){
 if(_tipEl.style.display!=='block')return;
 var tw=_tipEl.offsetWidth,th=_tipEl.offsetHeight;
 var x=e.clientX+14,y=e.clientY+18;
 if(x+tw>window.innerWidth-8)x=e.clientX-tw-14;
 if(y+th>window.innerHeight-8)y=e.clientY-th-14;
 _tipEl.style.left=Math.max(8,x)+'px';_tipEl.style.top=Math.max(8,y)+'px';
}
document.addEventListener('mouseover',function(e){
 var t=e.target.closest?e.target.closest('[data-tip]'):null;
 if(!t){_tipEl.style.display='none';return;}
 _tipEl.textContent=t.getAttribute('data-tip');_tipEl.style.display='block';_tipMove(e);
});

 var g=function(o){return o?(o[lang]||o.en||o.ko||''):'';};
 var actors=(c.actors||[]).map(function(a){var n=D.actors[a];return n?(n[lang]||n.en):a;}).join(' · ');
 var lf=D.life[c.life]?(D.life[c.life][lang]||D.life[c.life].en):(c.life||'');
 document.getElementById('csheet').innerHTML=
  '<div class="cshd">'+(D.logos[id]?('<span class="clogo xl lvc'+tierOf(c.level)+'">'+D.logos[id]+'</span>'):'')+
  '<div style="flex:1"><h3>'+esc(c[lang]||c.en)+'</h3><div class="csub">'+id+' · '+esc(ch[lang]||ch.en||c.char)+' · '+esc(c.level)+'</div></div>'+
  '<button class="cx" onclick="closeClaim()">×</button></div>'+
  '<div class="csbd">'+
  F(t('d_level'),'<span class="bdg l'+lv+'">'+esc(c.level)+' · '+t('L'+lv)+'</span>')+
  F(t('d_type'),esc(c.tcm||'—')+' · <b>TFL Type '+esc(c.tfltype||'—')+'</b>')+
  F(t('d_def'),esc(g(c.def)))+F(t('d_qual'),esc(g(c.qual)))+F(t('d_eval'),esc(g(c.eval)))+
  F(t('d_stmt'),esc(g(c.stmt)))+F(t('d_util'),esc(g(c.util)))+
  F(t('d_actor'),esc(actors))+F(t('d_life'),esc(lf))+
  F(t('d_std'),esc(g(c.std)))+F(t('d_reg'),esc(g(c.reg)))+F(t('d_analog'),esc(g(c.analog)))+
  '</div>';
 document.getElementById('cmodal').classList.add('on');
}
function tipOf(id){var m=D.logoMeanings&&D.logoMeanings[id];return m?(id+' · '+(m[lang]||m.en)):id;}
function isT3(id){return ((D.claims[id]||{}).tfltype)==='III';}
function tierOf(lv){lv=lv||'';return lv.indexOf('L3')===0?3:lv.indexOf('L2')===0?2:1;}
let logoTier='all';
function showLogos(tier){
 if(tier!==undefined)logoTier=tier;
 exMode='logos';isExample=false;paintSide();paintTfl();
 var ids=Object.keys(D.logos||{}).sort(function(a,b){var pa=a.split('-'),pb=b.split('-');return pa[0]===pb[0]?(+pa[1])-(+pb[1]):pa[0]<pb[0]?-1:1;});
 var tabs=['all',1,2,3,'T3'].map(function(x){var lb=x==='all'?t('all_tiers'):(x==='T3'?'Type III':'L'+x+' · '+t('L'+x));
   var arg=(x==='all'||x==='T3')?("'"+x+"'"):x;
   return '<button class="'+(logoTier===x?'on':'')+'" onclick="showLogos('+arg+')">'+lb+'</button>';}).join('');
 function grid(list){return '<div class="logogal">'+list.map(function(id){var lk=D.claims[id]||{};var nm=lk[lang]||lk.en||id;
   var tv=tierOf(lk.level);var cc=isT3(id)?'lvci':('lvc'+tv);
   return '<div class="lgi" data-tip="'+esc(tipOf(id))+'" onclick="openClaim(\''+id+'\')"><span class="clogo xl '+cc+'">'+D.logos[id]+'</span><span class="lgid">'+id+' · '+(lk.level||'')+(isT3(id)?' · Type III':'')+'</span><span class="lgnm">'+nm+'</span></div>';}).join('')+'</div>';}
 var body='';
 if(logoTier==='all'){
  [1,2,3].forEach(function(tv){var list=ids.filter(function(id){return tierOf((D.claims[id]||{}).level)===tv;});
   if(list.length)body+='<div class="lgh"><span class="tierb l'+tv+'">L'+tv+' · '+t('L'+tv)+'</span><span class="lgn">'+list.length+'</span></div>'+grid(list);});
 } else if(logoTier==='T3'){
  var list=ids.filter(isT3);
  body='<div class="lgh"><span class="tierb t3">Type III</span><span class="lgn">'+list.length+'</span></div>'+grid(list);
 } else {
  var list=ids.filter(function(id){return tierOf((D.claims[id]||{}).level)===logoTier;});
  body='<div class="lgh"><span class="tierb l'+logoTier+'">L'+logoTier+' · '+t('L'+logoTier)+'</span><span class="lgn">'+list.length+'</span></div>'+grid(list);
 }
 document.getElementById('label').innerHTML=`<div class="label">
  <div class="title"><b>${t('logo_title')}</b></div>
  <div class="anchor">${t('logo_intro')}</div>
  <div class="lgtabs">${tabs}</div>
  ${body}
 </div>`;
}
function renderFromInput(){
 try{inst=JSON.parse(document.getElementById('json').value);isExample=false;exMode='custom';paintTfl();document.getElementById('err').textContent='';render();}
 catch(e){document.getElementById('err').textContent=t('parse_err')+e.message;}
}
function valStr(c){
 if(typeof c.value==='boolean')return c.value?'✓':'✗';
 if(typeof c.value==='object'&&c.value)return Object.entries(c.value).map(([k,v])=>k+'='+v).join(' · ');
 if(c.value===undefined||c.value===null)return '';
 return c.value+(c.unit?(' '+c.unit):'');
}
function conformance(o){
 const g=o.guardrailAttestation||{}; const gok=g.noAbsoluteClaims&&g.noAdjectiveClaims&&g.perClaimVerificationBadge;
 const decl=new Set((o.claims||[]).filter(c=>c.status=='declared').map(c=>c.claimId));
 const na=new Set((o.naApplicability||[]).map(x=>x.characteristic));
 const baseOk = decl.has('TRA-1') && decl.has('ACC-1') && (decl.has('AUT-2')||na.has('authenticity'));
 const levels=(o.claims||[]).filter(c=>c.status=='declared').map(c=>lvOf(c.verificationLevel));
 const allL2=levels.length&&levels.every(x=>x>=2); const anyL3=levels.some(x=>x==3);
 let tier= allL2?t('t_ev'):t('t_dec');
 if(anyL3) tier += t('t_ver');
 return {ok:gok&&baseOk, tier, gok, baseOk};
}
const L3_DES=new Set(['SAF-1','SAF-2','SEC-7','QUA-1','ACC-2','FAI-4']);
function gradeOf(o,ok){
 if(!ok)return 'E';
 const decl=(o.claims||[]).filter(c=>c.status=='declared'); if(!decl.length)return 'E';
 const depth=decl.reduce((s,c)=>s+lvOf(c.verificationLevel),0)/decl.length;
 const l3ok=decl.filter(c=>L3_DES.has(c.claimId)).every(c=>lvOf(c.verificationLevel)==3);
 if(depth>=2.5&&l3ok&&decl.length>=10)return 'A';
 if(depth>=2.0&&l3ok)return 'B';
 if(depth>=1.5)return 'C';
 return 'D';
}
function render(){
 const o=inst; const cv=conformance(o); const p=o.product||{}; const dec=o.declarant||{};
 // front-of-pack: assurance grade + must-know 5
 const gr=gradeOf(o,cv.ok);
 const mk=D.mustknow[p.productType]||[];
 const declBy=id=>(o.claims||[]).find(c=>c.claimId==id&&c.status=='declared');
 let picks=mk.map(declBy).filter(Boolean);
 (o.claims||[]).filter(c=>c.status=='declared'&&!picks.includes(c)).forEach(c=>{if(picks.length<5)picks.push(c)});
 const sigs=picks.slice(0,5).map(c=>{const lk=D.claims[c.claimId]||{ko:c.claimId,en:c.claimId};const lv=lvOf(c.verificationLevel);
   const slg=(D.logos&&D.logos[c.claimId])?`<span class="clogo sm ${isT3(c.claimId)?'lvci':('lvc'+lvOf(c.verificationLevel))}" data-tip="${tipOf(c.claimId)}" onclick="openClaim('${c.claimId}')">${D.logos[c.claimId]}</span>`:'';
   return `<div class="sig"><div class="st"><span style="display:inline-flex;align-items:center;gap:5px">${slg}${lk[lang]}</span><span class="sv">${valStr(c)}</span></div><span class="sb l${lv}">${c.verificationLevel} · ${t('L'+lv)}</span></div>`;}).join('');
 const fop=`<div class="fop"><div class="grade g${gr}"><div class="g">${gr}</div><div class="gl">${t('grade_lab')}</div></div><div class="sigs">${sigs}</div></div>`;
 // group claims by characteristic in applicable order
 const order=o.applicableCharacteristics||[...new Set((o.claims||[]).map(c=>c.characteristic))];
 const byChar={}; (o.claims||[]).forEach(c=>{(byChar[c.characteristic]=byChar[c.characteristic]||[]).push(c)});
 let groups='';
 order.forEach(ch=>{
  const cl=byChar[ch]; if(!cl||!cl.length)return;
  const chl=D.chars[ch]?D.chars[ch][lang]:ch;
  // per-characteristic verification strength (ordinal, not a quality score)
  const cavg=cl.reduce((s,c)=>s+lvOf(c.verificationLevel),0)/cl.length;
  const cs=cavg>=2.5?3:cavg>=1.8?2:1;
  const cstag=`<span class="cstag l${cs}">${t('L'+cs)}</span>`;
  groups+=`<div class="grp"><h3><span>${chl} ${cstag}</span><span>${cl.length}</span></h3>`+cl.map(c=>{
   const lk=D.claims[c.claimId]||{ko:c.claimId,en:c.claimId}; const lv=lvOf(c.verificationLevel);
   const tv=c.thirdPartyVerifier;
   let ev='';
   if(mode=='b2b'){
    const parts=[];
    if(c.evidenceUri)parts.push(`<a href="${c.evidenceUri}" target="_blank" rel="noopener">▸ ${t('evidence')}</a>`);
    if(tv)parts.push(`<span class="verif">✓ ${t('verifiedBy')}: ${tv.name}${tv.certificateId?' ('+tv.certificateId+')':''}</span>`);
    if(parts.length)ev=`<div class="ev">${parts.join('')}</div>`;
    const m=c.measurement;
    if(m){const mm=[m.standardRef?('<b>§ '+m.standardRef+'</b>'):'',m.datasetVersion?('▷ '+m.datasetVersion):'',m.measuredOn?t('measured')+' '+m.measuredOn:'',m.window||'',m.scope||''].filter(Boolean).join(' · ');
      if(mm)ev+=`<div class="meta2">${mm}</div>`;}
    if(c.standardRef&&!(m&&m.standardRef))ev+=`<div class="meta2"><b>§ ${c.standardRef}</b></div>`;
   }
   const lg=(D.logos&&D.logos[c.claimId])?`<span class="clogo ${isT3(c.claimId)?'lvci':('lvc'+lvOf(c.verificationLevel))}" data-tip="${tipOf(c.claimId)}" onclick="openClaim('${c.claimId}')">${D.logos[c.claimId]}</span>`:'';
   return `<div class="cl"><div class="hd">${lg}
     <span class="nm">${lk[lang]}</span>
     <span class="val">${valStr(c)}</span>
     <span class="bdg l${lv}">${c.verificationLevel} · ${t('L'+lv)}</span>
    </div>
    <div class="stmt">${c.explanatoryStatement||''}</div>${ev}</div>`;
  }).join('')+`</div>`;
 });
 // EPD-style quantitative declaration panel (ISO 14025 Type III cf.)
 const qd=o.quantitativeDeclaration;
 const qdBlock=qd?`<div class="qd">
   <div class="qd-h">${t('qd_title')}</div>
   <div class="qd-row"><span>${t('qd_reg')}</span><b>${qd.registrationNumber||'—'}</b></div>
   <div class="qd-row"><span>${t('qd_op')}</span><span>${qd.programOperator||'—'}</span></div>
   <div class="qd-row"><span>${t('qd_pcr')}</span><span>${qd.categoryRules||'—'}</span></div>
   <div class="qd-row"><span>${t('qd_unit')}</span><span>${qd.declaredUnit||'—'}</span></div>
   <div class="qd-row"><span>${t('qd_verif')}</span><span>${qd.verificationText||'—'}${qd.validUntil?(' · ~'+qd.validUntil):''}</span></div>
   ${qd.comparabilityNote?`<div class="qd-cmp">${qd.comparabilityNote}</div>`:''}
  </div>`:'';
 const naBlock=(o.naApplicability&&o.naApplicability.length)?
   `<div class="na">${t('na')}: ${o.naApplicability.map(x=>(D.chars[x.characteristic]?D.chars[x.characteristic][lang]:x.characteristic)+(mode=='b2b'?(' — '+x.reason):'')).join(' · ')}</div>`:'';
 // anchor = scope claim (TRA-7) if present, else capability
 const anchorClaim=(o.claims||[]).find(c=>c.claimId=='TRA-7'||c.claimId=='TRA-3');
 const anchor=anchorClaim?`<div class="anchor"><span class="lab">${t('scope')}</span><br>${anchorClaim.explanatoryStatement||''}</div>`:'';
 document.getElementById('label').innerHTML=`
  <div class="label">
   <div class="title"><b>${t('facts')}</b>${qd?`<span class="epdbadge">${t('epd_badge')}</span>`:''}<span class="v">${o.labelVersion||''}</span></div>
   <div class="meta">
    <div class="row"><span>${t('product')}</span><b>${p.name||''} · ${p.version||''}</b></div>
    <div class="row"><span>${t('declarant')}</span><span>${dec.legalName||''} (${dec.role||''})</span></div>
    <div class="row"><span>${t('declared')} / ${t('expiry')}</span><span>${o.declarationDate||''} → ${o.expiryDate||'—'}</span></div>
    <div class="verdict">
     <span class="vbadge ${cv.ok?'ok':'no'}">${cv.ok?'✓ '+t('conformant'):'✗ '+t('nonconf')}</span>
     <span class="vbadge tier">${cv.tier}</span>
     <span class="vbadge tier">${t('grade_lab')} ${gr}</span>
    </div>
   </div>
   ${qdBlock}
   ${fop}
   ${anchor}
   ${groups}
   ${naBlock}
   <div class="legend">
    <span class="b"><span class="sw l1"></span>L1 ${t('L1')}</span>
    <span class="b"><span class="sw l2"></span>L2 ${t('L2')}</span>
    <span class="b"><span class="sw l3"></span>L3 ${t('L3')}</span>
   </div>
  </div>`;
}
applyLangUI(langFromURL()||'ko');loadExample();paintSide();
</script>
<div class="cmodal" id="cmodal" onclick="if(event.target===this)closeClaim()"><div class="csheet" id="csheet"></div></div>
</body></html>
