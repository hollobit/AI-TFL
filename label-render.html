<style>

body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.5;padding:30px 16px 80px;

.top{max-width:980px;margin:0 auto 22px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.top h1{font-family:var(--serif);font-weight:900;font-size:24px;letter-spacing:-.01em}

.seg{display:flex;border:1.5px solid var(--ink);font-family:var(--mono);font-size:12px;font-weight:600}
.seg button{background:transparent;border:0;padding:6px 12px;cursor:pointer;color:var(--ink);font-family:inherit;font-weight:inherit}
.seg button.on{background:var(--ink);color:var(--paper)}
.wrap{max-width:980px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;align-items:start}
@media(max-width:820px){.wrap{grid-template-columns:1fr}}
/* the label */
.label{border:2.5px solid var(--ink);background:var(--paper);box-shadow:7px 7px 0 rgba(27,24,19,.45)}

.verdict{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}

.vbadge.no{background:var(--accent);color:#fff;border-color:var(--accent)}

.qd-h{font-family:var(--mono);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--L3);margin-bottom:6px}
.qd-row{display:flex;gap:10px;padding:2px 0;font-size:12.5px}
.qd-row span:first-child{color:var(--ink2);font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.03em;min-width:118px;flex-shrink:0}
.qd-cmp{margin-top:7px;font-size:11px;color:var(--ink2);border-left:3px solid var(--L3);padding:4px 9px;background:var(--paper)}
.grp{border-bottom:1px solid var(--ink)}
.grp:last-child{border-bottom:0}

 background:var(--paper2);padding:6px 18px;border-bottom:1px solid var(--ink);display:flex;justify-content:space-between}
.cl{padding:9px 18px;border-bottom:1px dotted #c7bda8}
.clogo{width:24px;height:24px;flex-shrink:0;color:var(--accent);display:inline-flex;align-self:flex-start;margin-top:1px}
.clogo svg{width:100%;height:100%}
.clogo.sm{width:18px;height:18px;flex-shrink:0;align-self:center;margin-top:0}
.clogo.lv2,.clogo.lvc2{color:var(--L2)}
.clogo.lvc3{color:var(--L3)}

.clogo[data-tip]:hover::before,.lgi[data-tip]:hover::before{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);margin-top:2px;border:5px solid transparent;border-bottom-color:var(--ink);z-index:60}

.lgh .lgn{font-family:var(--mono);font-size:11px;color:var(--ink2)}
.clogo.xl{width:96px;height:96px;margin:0 auto}
.logogal{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;padding:18px}
.lgi{border:1.5px solid var(--ink);background:var(--paper);padding:18px 12px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.lgi .lgid{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--accent)}
.lgi .lgnm{font-family:var(--serif);font-weight:600;font-size:13.5px;line-height:1.25}
.tflbtns button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.cl:last-child{border-bottom:0}
.cl .hd{display:flex;align-items:center;gap:10px;justify-content:space-between}
.cl .nm{font-family:var(--serif);font-weight:600;font-size:15.5px;flex:1}
.cl .val{font-family:var(--mono);font-weight:700;font-size:14px;white-space:nowrap}
.bdg{font-family:var(--mono);font-size:9.5px;font-weight:700;color:#fff;padding:2px 6px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.bdg.l1{background:var(--L1);opacity:.78}.bdg.l2{background:var(--L2)}.bdg.l3{background:var(--L3)}
/* front-of-pack */
.fop{display:flex;gap:14px;align-items:stretch;border-bottom:6px solid var(--ink);padding:14px 18px;background:var(--paper2)}
.grade{flex-shrink:0;width:84px;border:2.5px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--paper)}
.grade .g{font-family:var(--serif);font-weight:900;font-size:46px;line-height:.9}

.grade.gA{background:#dff0e4}.grade.gB{background:#e1ecf5}.grade.gC{background:#f5ecd6}.grade.gD{background:#e9e2d0}.grade.gE{background:#f3ddd7}

.sig{border:1px solid var(--ink);background:var(--paper);padding:5px 9px;display:flex;flex-direction:column;gap:2px}

.fopcap{font-family:var(--mono);font-size:9px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2)}
.cstag{font-family:var(--mono);font-size:8.5px;font-weight:700;color:#fff;padding:1px 5px;margin-left:6px;vertical-align:middle}
.cstag.l1{background:var(--L1);opacity:.78}.cstag.l2{background:var(--L2)}.cstag.l3{background:var(--L3)}

.cl .stmt{font-size:12.5px;color:var(--ink2);margin-top:4px}

.na{padding:10px 18px;font-size:12px;color:var(--ink2);font-family:var(--mono)}
.legend{padding:11px 18px;border-top:6px solid var(--ink);font-size:11.5px;display:flex;flex-wrap:wrap;gap:12px;align-items:center}

.side{position:sticky;top:20px}

.mccmp{width:100%;border-collapse:collapse;margin-top:9px;font-size:11px;background:var(--paper)}
.mccmp th{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.03em;text-align:left;background:var(--ink);color:var(--paper);padding:4px 7px}

.b2b-only{display:block}
body.b2c .b2b-only{display:none}
body.b2c .cl .stmt{display:none}

 24027（AI 偏见）"}, {"claimId": "RSK-1", "characteristic": "risk", "status": "declared", "value": true, "verificationLevel": "L1", "explanatoryStatement": "局限与伦理：残留幻觉·时效性·偏见，自动化偏见·滥用风险。建议不单独用于安全关键或法律决策。", "standardRef": "ISO/IEC 23894（风险管理·伦理）"}, {"claimId": "TRA-12", "characteristic": "transparency", "status": "declared", "value": true, "verificationLevel": "L1", "explanatoryStatement": "提供下游集成指南·安全使用条件·推荐护栏。", "standardRef": "ISO/IEC 5338（生命周期·下游）"}, {"claimId": "ACC-1", "characteristic": "accountability", "status": "declared", "value": true, "verificationLevel": "L1", "explanatoryStatement": "责任组织：ExampleCorp 模型团队，联系 https://example.com/ai-trust/contact。", "standardRef": "ISO/IEC 42001（AI 管理体系）"}], "guardrailAttestation": {"noAbsoluteClaims": true, "noAdjectiveClaims": true, "perClaimVerificationBadge": true, "tamperEvidentTermsOnly": true}, "naApplicability": [{"characteristic": "authenticity", "reason": "无生成式输出 — 真实性不适用"}]}}}, "tflTypeIds": ["I", "II", "III", "IV"], "tflTypes": {"I": {"label": {"ko": "Type I · 제3자 인증", "en": "Type I · 3rd-party certified", "zh": "Type I · 第三方认证"}, "desc": {"ko": "라벨 전체를 제3자가 인증 → eco-label ISO 14024와 동형의 홀리스틱 씰이므로 **전 claim이 L3(제3자 검증)**. 고지·책임주체 baseline까지 인증기관이 확인. 예: AIMS(42001)·품질(9001)·보안(27001)·안전·편향. 각 claim에 인증기관·인증번호·범위·유효기간 첨부.", "en": "The whole label is third-party certified — a holistic seal like eco-label ISO 14024, so **every claim is L3 (third-party verified)**, including the AI-disclosure and accountable-party baseline. E.g., AIMS (42001), quality (9001), security (27001), safety, bias. Each claim carries certifier, certificate no., scope, validity.", "zh": "整个标签由第三方认证——与 eco-label ISO 14024 同构的整体印章，因此**每个 claim 均为 L3（第三方验证）**，连 AI 告知·责任主体 baseline 也由认证机构确认。如 AIMS(42001)·质量(9001)·安全保障(27001)·安全·偏见。每个 claim 附认证机构·证书编号·范围·有效期。"}}, "II": {"label": {"ko": "Type II · 자기선언", "en": "Type II · self-declared", "zh": "Type II · 自我声明"}, "desc": {"ko": "제공자가 **입증 가능한 특정 속성만 골라** 자기선언(eco-label ISO 14021과 동형 — à la carte). 포괄 패널이 아니라 **소수의 구체적 claim**(예: '학습 미사용'·'AI 생성 표기')을 선택 선언. 규율: 항목별 구체성·비모호(형용사 금지)·입증자료 보유. baseline(AI 고지·책임주체)만 시장 무결성 최소 floor. ※ 더 많은 특성을 선언하고 싶으면 제품유형 예제(포괄 패널) 참조.", "en": "The provider self-declares **only the specific attributes it can substantiate** (like eco-label ISO 14021 — à la carte): not a comprehensive panel but a **few specific claims** (e.g., 'no training on inputs', 'AI-generated marked'). Discipline: per-claim specificity, no vague adjectives, evidence on hand. Only the baseline (AI disclosure + accountable party) is a market-integrity floor. (For a fuller panel, see the product-type examples.)", "zh": "提供方**仅选择其可证实的特定属性**自行声明（与 eco-label ISO 14021 同构——按需/à la carte）：并非综合面板，而是**少数具体 claim**（如“不用于训练”·“标注 AI 生成”）。纪律：逐项具体·不含糊（禁形容词）·备有证据。仅 baseline（AI 告知·责任主体）为市场诚信底线。（如需更完整面板，参见产品类型示例。）"}}, "III": {"label": {"ko": "Type III · 생애주기 정량평가", "en": "Type III · lifecycle quantitative", "zh": "Type III · 生命周期定量"}, "desc": {"ko": "AI 모델·데이터의 **생성→개발→유통→사용→폐기 전 생애주기**가 신뢰성에 미치는 영향을 **10대 영향범주**로 정량 측정·제3자 검증하는 정량선언(환경 LCA/EPD ISO 14025와 동형). 각 범주는 **SC 42 표준의 요구사항**에 따라 벤치마크 세트 등 객관 지표로 정량화(benchmark는 평가 수단, 비해당 항목은 표준 측정법). **Type III 라벨을 단다는 것 = 그 기업이 '개발·사용 전 과정에서 AI 안전·신뢰성 향상에 힘쓰고 있음'을 정량 데이터로 투명 공개하고 독립 검증받아 자부하는 것**(환경 책임을 EPD로 증명하듯). 선언단위·등록번호·비교면책 포함, **순위·합격판정 없이** 데이터 공시. ↓ 10대 영향범주:", "en": "A quantitative declaration of how the **full AI lifecycle — generation → development → distribution → use → retirement** affects trustworthiness, measured across **10 impact categories** and third-party verified (like an environmental LCA/EPD, ISO 14025). Each category is quantified per **SC 42 standard requirements** using benchmark sets and objective indicators (a benchmark is the instrument; where none applies, the standard's own method). **Displaying a Type III label means the company transparently discloses, with quantitative data and independent verification, that it strives to improve AI safety & trustworthiness across development and use** — as an EPD attests environmental responsibility. Includes declared unit, registration no., comparability disclaimer; published as data — **no ranking, no pass/fail**. ↓ the 10 impact categories:", "zh": "对 **AI 全生命周期——生成 → 开发 → 流通 → 使用 → 退役** 如何影响可信性进行定量测量并第三方验证的定量声明（与环境 LCA/EPD、ISO 14025 同构），以 **10 大影响范畴** 表示。每个范畴依据 **SC 42 标准要求**、以基准集等客观指标定量化（基准为手段；不适用时采用标准自身方法）。**加贴 Type III 标签意味着：该企业以定量数据与独立验证透明公开其在开发与使用全过程中努力提升 AI 安全与可信性**（如 EPD 证明环境责任）。含声明单位·注册号·可比性免责；作为数据公示——**无排名·无合格判定**。↓ 10 大影响范畴："}, "impactLife": {"gen": {"ko": "생성", "en": "Generation", "zh": "生成"}, "dev": {"ko": "개발", "en": "Development", "zh": "开发"}, "dist": {"ko": "유통", "en": "Distribution", "zh": "流通"}, "use": {"ko": "사용", "en": "Use", "zh": "使用"}, "ret": {"ko": "폐기", "en": "Retirement", "zh": "退役"}}, "impacts": [{"cat": {"ko": "① 데이터 품질·대표성", "en": "① Data quality & representativeness", "zh": "① 数据质量·代表性"}, "life": "gen", "ind": "QUA-3 · DQ metrics", "std": "5259-2"}, {"cat": {"ko": "② 탄소·자원 발자국", "en": "② Carbon & resource footprint", "zh": "② 碳·资源足迹"}, "life": "gen", "ind": "SUS-1 · tCO2e·MWh", "std": "TR 20226"}, {"cat": {"ko": "③ 정확도·역량", "en": "③ Accuracy & capability", "zh": "③ 准确性·能力"}, "life": "dev", "ind": "ACU-1 · MMLU/HELM", "std": "TS 4213"}, {"cat": {"ko": "④ 견고성", "en": "④ Robustness", "zh": "④ 鲁棒性"}, "life": "dev", "ind": "ROB-1 · AdvGLUE/RobustBench", "std": "24029-2"}, {"cat": {"ko": "⑤ 공정성·편향", "en": "⑤ Fairness & bias", "zh": "⑤ 公平性·偏见"}, "life": "dev", "ind": "FAI-1 · BBQ/HolisticBias", "std": "TR 24027"}, {"cat": {"ko": "⑥ 투명성·설명충실도", "en": "⑥ Transparency & explanation faithfulness", "zh": "⑥ 透明性·解释忠实度"}, "life": "dist", "ind": "EXP-2 · faithfulness eval", "std": "TS 6254"}, {"cat": {"ko": "⑦ 안전·유해성", "en": "⑦ Safety & harm", "zh": "⑦ 安全·危害"}, "life": "use", "ind": "SAF-1 · HarmBench/JailbreakBench", "std": "TS 42119-7"}, {"cat": {"ko": "⑧ 보안·공격 내성", "en": "⑧ Security & attack resistance", "zh": "⑧ 安全防护·抗攻击"}, "life": "use", "ind": "SEC-4 · prompt-injection bench", "std": "27090"}, {"cat": {"ko": "⑨ 프라이버시·기억화", "en": "⑨ Privacy & memorization", "zh": "⑨ 隐私·记忆化"}, "life": "use", "ind": "PRV-6 · MIA/extraction", "std": "27091"}, {"cat": {"ko": "⑩ 데이터 삭제·모델 폐기", "en": "⑩ Data deletion & model retirement", "zh": "⑩ 数据删除·模型退役"}, "life": "ret", "ind": "PRV-5 · TOFU unlearning", "std": "8183/5338"}]}, "IV": {"label": {"ko": "Type IV · 개발자 기술카드(DTC)", "en": "Type IV · Developer Technical Card", "zh": "Type IV · 开发者技术卡(DTC)"}, "desc": {"ko": "개발자 기술카드(DTC) — model card와 유사하나 확장. 【유사】의도용도·학습데이터·아키텍처·계보·평가·한계를 구조적으로 공시(TRA-5·8·9·10·11). 【차이(DTC 추가)】①claim별 검증등급(L1/L2/L3) 배지 ②변조내성 용어만(형용사·최상급 금지) ③다운스트림 통합정보(TRA-12) ④기계가독 라벨로 하류 재선언 ⑤42117-X Type IV 표준 트랙. 각 공시 항목은 **SC 42 투명성·문서화 표준**을 참조 — 모델기술 ISO/IEC 25623·투명성분류 12792·데이터수명주기 8183·수명주기 5338·AIMS 42001. (model card는 자유서술·검증표시·표준참조가 없다.)", "en": "Developer Technical Card (DTC) — like a model card but extended. [Same] structured disclosure of intended use, training data, architecture, lineage, evaluation, limits (TRA-5·8·9·10·11). [Different — DTC adds] ① per-claim verification tier (L1/L2/L3) badges ② tamper-evident wording only (no adjectives/superlatives) ③ downstream-integration info (TRA-12) ④ machine-readable label for downstream re-declaration ⑤ standardized 42117-X Type IV track. Each disclosure references an **SC 42 transparency/documentation standard** — model description ISO/IEC 25623, transparency taxonomy 12792, data life cycle 8183, life cycle 5338, AIMS 42001. (A model card is free prose with no verification marking or standard reference.)", "zh": "开发者技术卡(DTC)——类似模型卡但更扩展。【相同】结构化披露预期用途·训练数据·架构·谱系·评估·局限（TRA-5·8·9·10·11）。【不同——DTC 增加】①每个 claim 的验证等级(L1/L2/L3)徽章 ②仅用防篡改措辞（禁形容词·最高级）③下游集成信息(TRA-12) ④机器可读标签供下游再声明 ⑤标准化 42117-X Type IV 轨道。每项披露均参照 **SC 42 透明性·文档化标准** —— 模型描述 ISO/IEC 25623·透明性分类 12792·数据生命周期 8183·生命周期 5338·AIMS 42001。（模型卡为自由叙述、无验证标记与标准参照。）"}, "compare": [{"mc": {"ko": "Model Details 모델 상세", "en": "Model Details", "zh": "Model Details 模型详情"}, "dtc": "TRA-9 · TRA-10", "std": "25623"}, {"mc": {"ko  grade_lab:{ko:'검증등급',en:'ASSURANCE',zh:'保障等级'},
 mustknow:{ko:'핵심 5',en:'KEY 5',zh:'关键 5'},
 L1:{ko:'자기선언',en:'Self-declared',zh:'自我声明'},L2:{ko:'입증공개',en:'Evidenced',zh:'证据公开'},L3:{ko:'제3자검증',en:'3rd-party',zh:'第三方验证'},
 measured:{ko:'측정',en:'measured',zh:'测量'},
 parse_err:{ko:'JSON 파싱 오류: ',en:'JSON parse error: ',zh:'JSON 解析错误：'},
 logo_menu:{ko:'라벨 로고',en:'Claim logos',zh:'声明标志'},
 all_tiers:{ko:'전체',en:'All',zh:'全部'},
 logo_title:{ko:'Type II 자기선언 claim 로고',en:'Type II self-declared claim logos',zh:'Type II 自我声明 claim 标志'},
 logo_intro:{ko:'eco-label 마크(뫼비우스 루프)와 동형의 claim 마크 — 단색 픽토그램, 라벨·제품 표면·문서에 동일하게 표시.',en:'Claim marks isomorphic to eco-label symbols (Möbius loop) — monochrome pictograms shown identically on labels, product surfaces and documents.',zh:'与环保标签符号（莫比乌斯环）同构的 claim 标志——单色图标，可同样显示于标签·产品表面·文档。'},
 t_ev:{ko:'🥈 입증',en:'🥈 Evidenced',zh:'🥈 证据'}, t_dec:{ko:'🥉 선언',en:'🥉 Declared',zh:'🥉 声明'}, t_ver:{ko:' +🥇검증',en:' +🥇Verified',zh:' +🥇验证'},
 qd_title:{ko:'정량 선언 (EPD형 · ISO 14025 참조)',en:'Quantitative declaration (EPD-style · cf. ISO 14025)',zh:'定量声明（EPD 型 · 参照 ISO 14025）'},
 qd_reg:{ko:'등록번호',en:'Registration',zh:'注册号'}, qd_op:{ko:'프로그램 운영자',en:'Program operator',zh:'项目运营方'},
 qd_pcr:{ko:'평가범주규칙(PCR)',en:'Category rules (PCR)',zh:'类别规则(PCR)'}, qd_unit:{ko:'선언단위',en:'Declared unit',zh:'声明单位'},
 qd_verif:{ko:'독립 검증',en:'Independent verification',zh:'独立验证'}, epd_badge:{ko:'EPD형 정량선언',en:'EPD-style quantitative',zh:'EPD 型定量声明'},
 mc_hdr:{ko:'Model Card 어휘',en:'Model Card vocabulary',zh:'Model Card 词汇'}, dtc_hdr:{ko:'DTC 항목(Type IV)',en:'DTC item (Type IV)',zh:'DTC 项(Type IV)'}, std_hdr:{ko:'SC 42 표준',en:'SC 42 standard',zh:'SC 42 标准'},
 im_cat:{ko:'영향 범주',en:'Impact category',zh:'影响范畴'}, im_life:{ko:'생애주기',en:'Lifecycle',zh:'生命周期'}, im_ind:{ko:'지표·벤치마크',en:'Indicator · benchmark',zh:'指标·基准'},
};
function esc(s){return String(s==null?'':s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
const t=k=>STR[k]?(STR[k][lang]||STR[k].en):k;
const lvOf=l=>l&&l.includes('L3')?3:l&&l.includes('L2')?2:1;
function setLang(l){lang=l;['ko','en','zh'].forEach(function(x){var b=document.getElementById(x);if(b)b.classList.toggle('on',l==x);});paintSide();if(exMode==='logos'){showLogos();}else if(isExample){if(exMode==='tfl')loadTflExample();else loadExample();}else render();}
function setMode(m){mode=m;document.body.className=m;document.getElementById('b2c').classList.toggle('on',m=='b2c');document.getElementById('b2b').classList.toggle('on',m=='b2b');render();}
function paintTypeSel(){var sel=document.getElementById('ex-type');if(!sel||!D.exampleTypes)return;
 sel.innerHTML=D.exampleTypes.map(function(tp){var nm=(D.ptypes&&D.ptypes[tp]&&D.ptypes[tp][lang])||tp;return '<option value="'+tp+'"'+(tp===curType?' selected':'')+'>'+nm+'</option>';}).join('');}
function paintTfl(){var box=document.getElementById('tfl-btns');if(!box||!D.tflTypeIds)return;
 document.getElementById('tfl-lab').textContent=({ko:'TFL Type 예제',en:'TFL Type examples',zh:'TFL Type 示例'})[lang];
 box.innerHTML=D.tflTypeIds.map(function(id){var lb=(D.tflTypes[id].label[lang])||id;
  return '<button onclick="loadTflExample(\''+id+'\')" class="'+(exMode==='tfl'&&curTfl===id?'on':'')+'">'+lb+'</button>';}).join('');
 var d=document.getElementById('tfl-desc');
 if(exMode==='tfl'&&D.tflTypes[curTfl]){
  var T=D.tflTypes[curTfl];
  var html='<div>'+esc(T.desc[lang]||'')+'</div>';
  if(T.impacts){
   html+='<table class="mccmp"><thead><tr><th>'+t('im_cat')+'</th><th>'+t('im_life')+'</th><th>'+t('im_ind')+'</th><th>'+t('std_hdr')+'</th></tr></thead><tbody>'+
    T.impacts.map(function(r){var lf=(T.impactLife&&T.impactLife[r.life])?(T.impactLife[r.life][lang]||T.impactLife[r.life].en):r.life;
     return '<tr><td>'+esc(r.cat[lang]||r.cat.en)+'</td><td>'+esc(lf)+'</td><td>'+esc(r.ind)+'</td><td>'+esc(r.std)+'</td></tr>';}).join('')+'</tbody></table>';
  }
  if(T.compare){
   html+='<table class="mccmp"><thead><tr><th>'+t('mc_hdr')+'</th><th>'+t('dtc_hdr')+'</th><th>'+t('std_hdr')+'</th></tr></thead><tbody>'+
    T.compare.map(function(r){var dtc=(r.dtc&&typeof r.dtc==='object')?(r.dtc[lang]||r.dtc.en):r.dtc;
     return '<tr><td>'+esc(r.mc[lang]||r.mc.en)+'</td><td>'+esc(dtc)+'</td><td>'+esc(r.std)+'</td></tr>';}).join('')+'</tbody></table>';
  }
  d.innerHTML=html;d.classList.add('show');
 } else {d.classList.remove('show');}}
function paintSide(){document.getElementById('side-title').textContent=t('side_title');document.getElementById('btn-render').textContent=t('render');document.getElementById('btn-ex').textContent=t('ex');var bl=document.getElementById('btn-logos');if(bl){bl.textContent=t('logo_menu');bl.classList.toggle('on',exMode==='logos');}document.getElementById('hint').textContent=t('hint');paintTypeSel();paintTfl();}
function loadExample(tp){if(tp)curType=tp;exMode='ptype';isExample=true;inst=exFor(curType,lang);document.getElementById('json').value=JSON.stringify(inst,null,2);document.getElementById('err').textContent='';var sel=document.getElementById('ex-type');if(sel)sel.value=curType;paintTfl();render();}
function loadTflExample(tp){if(tp)curTfl=tp;exMode='tfl';isExample=true;inst=tflFor(curTfl,lang);document.getElementById('json').value=JSON.stringify(inst,null,2);document.getElementById('err').textContent='';paintTfl();render();}
function tipOf(id){var m=D.logoMeanings&&D.logoMeanings[id];return m?(id+' · '+(m[lang]||m.en)):id;}
function tierOf(lv){lv=lv||'';return lv.indexOf('L3')===0?3:lv.indexOf('L2')===0?2:1;}
let logoTier='all';
function showLogos(tier){
 if(tier!==undefined)logoTier=tier;
 exMode='logos';isExample=false;paintSide();paintTfl();
 var ids=Object.keys(D.logos||{}).sort(function(a,b){var pa=a.split('-'),pb=b.split('-');return pa[0]===pb[0]?(+pa[1])-(+pb[1]):pa[0]<pb[0]?-1:1;});
 var tabs=['all',1,2,3].map(function(x){var lb=x==='all'?t('all_tiers'):'L'+x+' · '+t('L'+x);
   return '<button class="'+(logoTier===x?'on':'')+'" onclick="showLogos('+(x==='all'?"'all'":x)+')">'+lb+'</button>';}).join('');
 function grid(list){return '<div class="logogal">'+list.map(function(id){var lk=D.claims[id]||{};var nm=lk[lang]||lk.en||id;
   var tv=tierOf(lk.level); return '<div class="lgi" data-tip="'+esc(tipOf(id))+'"><span class="clogo xl lvc'+tv+'">'+D.logos[id]+'</span><span class="lgid">'+id+' · '+(lk.level||'')+'</span><span class="lgnm">'+nm+'</span></div>';}).join('')+'</div>';}
 var body='';
 if(logoTier==='all'){
  [1,2,3].forEach(function(tv){var list=ids.filter(function(id){return tierOf((D.claims[id]||{}).level)===tv;});
   if(list.length)body+='<div class="lgh"><span class="tierb l'+tv+'">L'+tv+' · '+t('L'+tv)+'</span><span class="lgn">'+list.length+'</span></div>'+grid(list);});
 } else {
  var list=ids.filter(function(id){return tierOf((D.claims[id]||{}).level)===logoTier;});
  body='<div class="lgh"><span class="tierb l'+logoTier+'">L'+logoTier+' · '+t('L'+logoTier)+'</span><span class="lgn">'+list.length+'</span></div>'+grid(list);
 }
 document.getElementById('label').innerHTML=`<div class="label">
  <div class="title"><b>${t('logo_title')}</b></div>
  <div class="anchor">${t('logo_intro')}</div>
  <div class="lgtabs">${tabs}</div>
  ${body}
 </div>`;
}
function renderFromInput(){
 try{inst=JSON.parse(document.getElementById('json').value);isExample=false;exMode='custom';paintTfl();document.getElementById('err').textContent='';render();}
 catch(e){document.getElementById('err').textContent=t('parse_err')+e.message;}
}
function valStr(c){
 if(typeof c.value==='boolean')return c.value?'✓':'✗';
 if(typeof c.value==='object'&&c.value)return Object.entries(c.value).map(([k,v])=>k+'='+v).join(' · ');
 if(c.value===undefined||c.value===null)return '';
 return c.value+(c.unit?(' '+c.unit):'');
}
function conformance(o){
 const g=o.guardrailAttestation||{}; const gok=g.noAbsoluteClaims&&g.noAdjectiveClaims&&g.perClaimVerificationBadge;
 const decl=new Set((o.claims||[]).filter(c=>c.status=='declared').map(c=>c.claimId));
 const na=new Set((o.naApplicability||[]).map(x=>x.characteristic));
 const baseOk = decl.has('TRA-1') && decl.has('ACC-1') && (decl.has('AUT-2')||na.has('authenticity'));
 const levels=(o.claims||[]).filter(c=>c.status=='declared').map(c=>lvOf(c.verificationLevel));
 const allL2=levels.length&&levels.every(x=>x>=2); const anyL3=levels.some(x=>x==3);
 let tier= allL2?t('t_ev'):t('t_dec');
 if(anyL3) tier += t('t_ver');
 return {ok:gok&&baseOk, tier, gok, baseOk};
}
const L3_DES=new Set(['SAF-1','SAF-2','SEC-7','QUA-1','ACC-2','FAI-4']);
function gradeOf(o,ok){
 if(!ok)return 'E';
 const decl=(o.claims||[]).filter(c=>c.status=='declared'); if(!decl.length)return 'E';
 const depth=decl.reduce((s,c)=>s+lvOf(c.verificationLevel),0)/decl.length;
 const l3ok=decl.filter(c=>L3_DES.has(c.claimId)).every(c=>lvOf(c.verificationLevel)==3);
 if(depth>=2.5&&l3ok&&decl.length>=10)return 'A';
 if(depth>=2.0&&l3ok)return 'B';
 if(depth>=1.5)return 'C';
 return 'D';
}
function render(){
 const o=inst; const cv=conformance(o); const p=o.product||{}; const dec=o.declarant||{};
 // front-of-pack: assurance grade + must-know 5
 const gr=gradeOf(o,cv.ok);
 const mk=D.mustknow[p.productType]||[];
 const declBy=id=>(o.claims||[]).find(c=>c.claimId==id&&c.status=='declared');
 let picks=mk.map(declBy).filter(Boolean);
 (o.claims||[]).filter(c=>c.status=='declared'&&!picks.includes(c)).forEach(c=>{if(picks.length<5)picks.push(c)});
 const sigs=picks.slice(0,5).map(c=>{const lk=D.claims[c.claimId]||{ko:c.claimId,en:c.claimId};const lv=lvOf(c.verificationLevel);
   const slg=(D.logos&&D.logos[c.claimId])?`<span class="clogo sm lvc${lvOf(c.verificationLevel)}" data-tip="${tipOf(c.claimId)}">${D.logos[c.claimId]}</span>`:'';
   return `<div class="sig"><div class="st"><span style="display:inline-flex;align-items:center;gap:5px">${slg}${lk[lang]}</span><span class="sv">${valStr(c)}</span></div><span class="sb l${lv}">${c.verificationLevel} · ${t('L'+lv)}</span></div>`;}).join('');
 const fop=`<div class="fop"><div class="grade g${gr}"><div class="g">${gr}</div><div class="gl">${t('grade_lab')}</div></div><div class="sigs">${sigs}</div></div>`;
 // group claims by characteristic in applicable order
 const order=o.applicableCharacteristics||[...new Set((o.claims||[]).map(c=>c.characteristic))];
 const byChar={}; (o.claims||[]).forEach(c=>{(byChar[c.characteristic]=byChar[c.characteristic]||[]).push(c)});
 let groups='';
 order.forEach(ch=>{
  const cl=byChar[ch]; if(!cl||!cl.length)return;
  const chl=D.chars[ch]?D.chars[ch][lang]:ch;
  // per-characteristic verification strength (ordinal, not a quality score)
  const cavg=cl.reduce((s,c)=>s+lvOf(c.verificationLevel),0)/cl.length;
  const cs=cavg>=2.5?3:cavg>=1.8?2:1;
  const cstag=`<span class="cstag l${cs}">${t('L'+cs)}</span>`;
  groups+=`<div class="grp"><h3><span>${chl} ${cstag}</span><span>${cl.length}</span></h3>`+cl.map(c=>{
   const lk=D.claims[c.claimId]||{ko:c.claimId,en:c.claimId}; const lv=lvOf(c.verificationLevel);
   const tv=c.thirdPartyVerifier;
   let ev='';
   if(mode=='b2b'){
    const parts=[];
    if(c.evidenceUri)parts.push(`<a href="${c.evidenceUri}" target="_blank" rel="noopener">▸ evidence</a>`);
    if(tv)parts.push(`<span class="verif">✓ ${t('verifiedBy')}: ${tv.name}${tv.certificateId?' ('+tv.certificateId+')':''}</span>`);
    if(parts.length)ev=`<div class="ev">${parts.join('')}</div>`;
    const m=c.measurement;
    if(m){const mm=[m.standardRef?('<b>§ '+m.standardRef+'</b>'):'',m.datasetVersion?('▷ '+m.datasetVersion):'',m.measuredOn?t('measured')+' '+m.measuredOn:'',m.window||'',m.scope||''].filter(Boolean).join(' · ');
      if(mm)ev+=`<div class="meta2">${mm}</div>`;}
    if(c.standardRef&&!(m&&m.standardRef))ev+=`<div class="meta2"><b>§ ${c.standardRef}</b></div>`;
   }
   const lg=(D.logos&&D.logos[c.claimId])?`<span class="clogo lvc${lvOf(c.verificationLevel)}" data-tip="${tipOf(c.claimId)}">${D.logos[c.claimId]}</span>`:'';
   return `<div class="cl"><div class="hd">${lg}
     <span class="nm">${lk[lang]}</span>
     <span class="val">${valStr(c)}</span>
     <span class="bdg l${lv}">${c.verificationLevel} · ${t('L'+lv)}</span>
    </div>
    <div class="stmt">${c.explanatoryStatement||''}</div>${ev}</div>`;
  }).join('')+`</div>`;
 });
 // EPD-style quantitative declaration panel (ISO 14025 Type III cf.)
 const qd=o.quantitativeDeclaration;
 const qdBlock=qd?`<div class="qd">
   <div class="qd-h">${t('qd_title')}</div>
   <div class="qd-row"><span>${t('qd_reg')}</span><b>${qd.registrationNumber||'—'}</b></div>
   <div class="qd-row"><span>${t('qd_op')}</span><span>${qd.programOperator||'—'}</span></div>
   <div class="qd-row"><span>${t('qd_pcr')}</span><span>${qd.categoryRules||'—'}</span></div>
   <div class="qd-row"><span>${t('qd_unit')}</span><span>${qd.declaredUnit||'—'}</span></div>
   <div class="qd-row"><span>${t('qd_verif')}</span><span>${qd.verificationText||'—'}${qd.validUntil?(' · ~'+qd.validUntil):''}</span></div>
   ${qd.comparabilityNote?`<div class="qd-cmp">${qd.comparabilityNote}</div>`:''}
  </div>`:'';
 const naBlock=(o.naApplicability&&o.naApplicability.length)?
   `<div class="na">${t('na')}: ${o.naApplicability.map(x=>(D.chars[x.characteristic]?D.chars[x.characteristic][lang]:x.characteristic)+(mode=='b2b'?(' — '+x.reason):'')).join(' · ')}</div>`:'';
 // anchor = scope claim (TRA-7) if present, else capability
 const anchorClaim=(o.claims||[]).find(c=>c.claimId=='TRA-7'||c.claimId=='TRA-3');
 const anchor=anchorClaim?`<div class="anchor"><span class="lab">${t('scope')}</span><br>${anchorClaim.explanatoryStatement||''}</div>`:'';
 document.getElementById('label').innerHTML=`
  <div class="label">
   <div class="title"><b>${t('facts')}</b>${qd?`<span class="epdbadge">${t('epd_badge')}</span>`:''}<span class="v">${o.labelVersion||''}</span></div>
   <div class="meta">
    <div class="row"><span>${t('product')}</span><b>${p.name||''} · ${p.version||''}</b></div>
    <div class="row"><span>${t('declarant')}</span><span>${dec.legalName||''} (${dec.role||''})</span></div>
    <div class="row"><span>${t('declared')} / ${t('expiry')}</span><span>${o.declarationDate||''} → ${o.expiryDate||'—'}</span></div>
    <div class="verdict">
     <span class="vbadge ${cv.ok?'ok':'no'}">${cv.ok?'✓ '+t('conformant'):'✗ '+t('nonconf')}</span>
     <span class="vbadge tier">${cv.tier}</span>
     <span class="vbadge tier">${t('grade_lab')} ${gr}</span>
    </div>
   </div>
   ${qdBlock}
   ${fop}
   ${anchor}
   ${groups}
   ${naBlock}
   <div class="legend">
    <span class="b"><span class="sw l1"></span>L1 ${t('L1')}</span>
    <span class="b"><span class="sw l2"></span>L2 ${t('L2')}</span>
    <span class="b"><span class="sw l3"></span>L3 ${t('L3')}</span>
   </div>
  </div>`;
}
loadExample();paintSide();
</script>
</body></html>
